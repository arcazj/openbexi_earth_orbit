name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBEXI_PYTHON_COMMAND: python

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit, API, and dependency checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify clean commit bytes
        run: npm run check:release-tree -- --tree HEAD --require-clean

      - name: Verify configured Python interpreter
        run: node scripts/python.mjs -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

      - name: Install locked dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: JavaScript unit and contract tests
        run: npm run test:unit

      - name: Python server integration tests
        run: npm run test:python

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Generate CycloneDX SBOM
        run: npm run sbom -- --output openbexi-node-sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-sbom-${{ matrix.os }}
          path: openbexi-node-sbom.cdx.json
          if-no-files-found: error

  browser-smoke:
    name: Browser engines and core journeys (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, mobile-chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify configured Python interpreter
        run: node scripts/python.mjs -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

      - name: Run browser smoke test
        run: npm run test:browser -- --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

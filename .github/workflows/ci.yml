name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit, API, and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: JavaScript unit and contract tests
        run: npm run test:unit

      - name: Python server integration tests
        run: npm run test:python

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Generate CycloneDX SBOM
        run: npm run sbom -- --output openbexi-node-sbom.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: node-sbom
          path: openbexi-node-sbom.cdx.json
          if-no-files-found: error

  browser-smoke:
    name: Chromium smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:browser

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

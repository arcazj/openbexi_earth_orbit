<button id="menuToggleBtn" aria-label="Close menu">Close</button>
<div id="startupFailure" hidden>
    <div class="empty-state startup-error" role="alert" data-error-code="STARTUP_FAILED">
        <strong>Application failed to start.</strong>

<aside id="trackedCoverageHud" class="tracked-coverage-hud" role="status" aria-live="polite" hidden>

        <span><b id="trackedCoveragePositioned">0</b> positioned</span>
        <span><b id="trackedCoverageUnavailable">0</b> position unavailable</span>
    </div>
    <div class="tracked-coverage-meta">

    </div>

<section id="trackedResultsDrawer" class="tracked-results-drawer" aria-labelledby="trackedResultsTitle" hidden></section>
<aside id="selectedSatelliteDetailPanel" class="selected-satellite-detail-panel" aria-live="polite" hidden></aside>
<aside id="solarSystemPlanetHud" class="selected-satellite-detail-panel solar-system-planet-hud" aria-live="polite" hidden></aside>

    // Helper: write ECEF -> scene into "out"
    function ecefToScene(out, x, y, z, rotY) {
        // Swap Y/Z for scene, rotate around Y, scale to scene units.
        return ecfToSceneVector(out, { x, y, z }, rotY);
    }

    function sceneToEcefKm(sceneVec, rotY) {
        // Inverse of ecefToScene: rotate back, un-swap axes, convert to km
        const unrotated = V_TMP4.copy(sceneVec)
            .multiplyScalar(SCENE_TO_KM)
            .applyAxisAngle(AXIS_Y, -rotY);

        return {
            x: unrotated.x,
            y: unrotated.z,
            z: unrotated.y
        };
    }

        const { x, y, z } = vec;
        const r = Math.sqrt(x * x + y * y + z * z);
        if (r === 0) return null;

        const latDeg = Math.asin(z / r) * R2D;
        const lonDeg = Math.atan2(y, x) * R2D;
        return { latDeg, lonDeg };
    }

    function satelliteScreeningRecord(satData) {
        if (!hasActiveSatelliteSceneRecord(satData)) return null;
        if (satData.catalogObject) return satData.catalogObject;
        return {
            object_id: satData.object_id,
            satellite_name: satData.satellite_name,
            name: satData.satellite_name,
            norad_id: satData.norad_id?.toString() || null,
            international_designator: satData.international_designator || null,
            object_type: satData.object_type || 'UNKNOWN',
            orbit_class: satData.orbit_class || satData.orbitType || 'UNKNOWN',
            lifecycle_status: satData.lifecycle_status || 'UNKNOWN',
            launch_date: satData.launch_date || null,
            tle_line1: satData.tle_line1,
            tle_line2: satData.tle_line2,
            element_set: satData.element_set,
            provenance: satData.provenance,
            perigee_km: satData.perigee_km,
            apogee_km: satData.apogee_km,
            quality_flags: satData.quality_flags || []
        };
    }

    function satelliteForConjunctionObject(objectId) {
        const noradId = noradIdFromInternalObjectId(objectId);
        if (!noradId) return null;
        return satellites.find(sat => {
            try {
                return normalizeNoradId(sat?.norad_id) === noradId;
            } catch {
                return false;
            }
        }) || null;
    }

    function conjunctionTrajectory(record, tca, spanSeconds = 300, stepSeconds = 30) {
        if (!record || !conjunctionPropagationService || !Number.isFinite(tca?.getTime?.())) return [];
        const prepared = conjunctionPropagationService.prepareObject(record);
        if (!prepared.ok) return [];
        const samples = [];
        for (let offset = -spanSeconds; offset <= spanSeconds; offset += stepSeconds) {
            const state = conjunctionPropagationService.propagate(
                prepared.value,
                new Date(tca.getTime() + offset * 1000)
            );
            if (state.ok) samples.push(state.value);
        }
        return samples;
    }

    function setConjunctionSimulationTime(date) {
        if (!Number.isFinite(date?.getTime?.())) return;
        const state = simulationClock.reset(date.getTime(), 0);
        simParams.timeWarp = state.rate;
        SIM_DATE.setTime(state.timeMs);
        simParams.simDate = SIM_DATE;
        updateTimeWarpControls();
    }

    function showConjunctionEvent(event) {
        selectedConjunctionEvent = event || null;
        simParams.conjunctionEventId = event?.event_id || event?.eventId || '';
        simParams.conjunctionRequestId = event?.request_id || event?.requestId || '';
        refreshShareControls();
        if (!conjunctionLayer) return;
        if (!event) {
            activeConjunctionPrimary = null;
            activeConjunctionSecondary = null;
            conjunctionLayer.clear();
            return;
        }
        const tca = new Date(event.tca);
        const primarySatellite = satelliteForConjunctionObject(event.primary_object_id) || currentSelectedSatellite;
        const secondarySatellite = satelliteForConjunctionObject(event.secondary_object_id);
        const primaryRecord = satelliteScreeningRecord(primarySatellite);
        const secondaryRecord = satelliteScreeningRecord(secondarySatellite);
        const preparedPrimary = conjunctionPropagationService?.prepareObject(primaryRecord);
        const preparedSecondary = conjunctionPropagationService?.prepareObject(secondaryRecord);
        activeConjunctionPrimary = preparedPrimary?.ok ? preparedPrimary.value : primaryRecord;
        activeConjunctionSecondary = preparedSecondary?.ok ? preparedSecondary.value : secondaryRecord;
        const shown = conjunctionLayer.showEvent(event, {
            primary: conjunctionTrajectory(activeConjunctionPrimary, tca),
            secondary: conjunctionTrajectory(activeConjunctionSecondary, tca)
        });
        if (!shown) return;
        disableSelectedModelTracking();
        setConjunctionSimulationTime(tca);
        const focusObject = conjunctionLayer.focusObject();
        if (focusObject && simParams.view3D) {
            const cameraDurationMs = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 0 : 1000;
            flyCameraToObject(focusObject, cameraDurationMs, {
                distanceMultiplier: 8,
                minContextDistance: EARTH_SCENE_RADIUS * 0.15
            });
        }
    }

    function updateConjunctionPlayback(event, date) {
        if (!event || !activeConjunctionPrimary || !activeConjunctionSecondary || !conjunctionPropagationService) return;
        const primaryState = conjunctionPropagationService.propagate(activeConjunctionPrimary, date);
        const secondaryState = conjunctionPropagationService.propagate(activeConjunctionSecondary, date);
        if (primaryState.ok && secondaryState.ok) {
            setConjunctionSimulationTime(date);
            conjunctionLayer?.updateStates(primaryState.value, secondaryState.value);
        }
    }

    async function loadTrackedCoverageManifest() {
        if (trackedCatalogLineageBlocked) return null;
        const cachedManifest = trackedObjectCatalogLoader?.snapshot?.().manifest;
        if (cachedManifest) return cachedManifest;
        if (!trackedObjectCatalogLoader?.readManifest) return null;

        let timeoutId = null;
        const manifestRequest = trackedObjectCatalogLoader.readManifest().catch(error => {
            console.debug('[conjunction] Tracked catalog manifest is temporarily unavailable.', error);
            return null;
        });
        try {
            return await Promise.race([
                manifestRequest,
                new Promise(resolve => {
                    timeoutId = setTimeout(() => resolve(null), 250);
                })
            ]);
        } finally {
            if (timeoutId !== null) clearTimeout(timeoutId);
        }
    }

    function conjunctionTrackedCoverageFields(manifest, propagatablePopulation) {
        const counts = manifest?.counts ?? {};
        const trackedCandidate = counts.current ?? counts.current_tracked ?? counts.current_records;
        const parsedTracked = trackedCandidate === undefined || trackedCandidate === null
            ? NaN
            : Number(trackedCandidate);
        const trackedPopulation = Number.isInteger(parsedTracked) && parsedTracked >= 0
            ? parsedTracked
            : null;
        const metadataOnlyPopulation = trackedPopulation === null
            ? null
            : Math.max(0, trackedPopulation - propagatablePopulation);
        const coverageFraction = trackedPopulation === null
            ? null
            : trackedPopulation > 0
                ? Math.min(1, propagatablePopulation / trackedPopulation)
                : 1;
        return {
            tracked_catalog_revision: manifest?.catalog_revision ?? manifest?.revision ?? null,
            tracked_population: trackedPopulation,
            propagatable_population: propagatablePopulation,
            metadata_only_population: metadataOnlyPopulation,
            tracked_count: trackedPopulation,
            propagatable_count: propagatablePopulation,
            metadata_only_excluded_count: metadataOnlyPopulation,
            screening_coverage_fraction: coverageFraction
        };
    }

    async function loadConjunctionCatalogMetadata(propagatablePopulation = uniqueSatelliteCount(satellites)) {
        const trackedManifestPromise = loadTrackedCoverageManifest();
        try {
            const activeKind = getActiveCatalogKind() || 'GP';
            const metadataPath = activeKind === 'TLE'
                ? 'json/tle/TLE.meta.json'
                : 'json/gp/GP.meta.json';
            const runtimeConnection = window.openbexiServerConnection;
            const resolveMetadataUrl = (url) => runtimeConnection?.connected
                ? (runtimeConnection.resolveDataUrl?.(url) || url)
                : url;
            const response = await fetch(resolveMetadataUrl(metadataPath), { cache: 'no-store' });
            if (!response.ok) throw new Error(`catalog metadata request returned ${response.status}`);
            const metadata = await response.json();
            const snapshot = getActiveCatalogValidationSnapshot() || getLastCatalogValidationSnapshot();
            const provenance = snapshot?.provenance || {};
            const quality = snapshot?.quality || {};
            const retrievedAt = provenance.retrieved_at || metadata.fetched_at || metadata.last_success_at || null;
            const retrievedTime = retrievedAt ? Date.parse(retrievedAt) : NaN;
            const existingCount = Number(metadata.counts?.existing);
            const updatedCount = Number(metadata.counts?.updated);
            const retainedCount = Number.isFinite(Number(metadata.counts?.retained))
                ? Number(metadata.counts.retained)
                : (Number.isFinite(existingCount) && Number.isFinite(updatedCount)
                    ? Math.max(0, existingCount - updatedCount)
                    : null);
            const trackedManifest = await trackedManifestPromise;
            return {
                dataset_id: provenance.dataset_id || metadata.dataset_id || `celestrak-gp:${retrievedAt || 'unknown'}`,
                dataset_hash: provenance.dataset_hash || metadata.dataset_hash || null,
                retrieved_at: retrievedAt,
                ageDays: Number.isFinite(retrievedTime) ? Math.max(0, (Date.now() - retrievedTime) / 86_400_000) : null,
                provider: provenance.provider || 'CelesTrak',
                source_id: provenance.source_id || 'celestrak-gp-catalog',
                source_uri: provenance.source_uri || null,
                license_id: provenance.license_id || null,
                rejectedCount: Number(quality.quarantined_records ?? metadata.counts?.rejected) || 0,
                retainedCount,
                source_status: String(snapshot?.status || provenance.source_status || metadata.last_status || 'unknown').toUpperCase(),
                partial_update: snapshot?.status === 'PARTIAL' || provenance.partial_update === true || metadata.mode === 'incremental',
                quality,
                ...conjunctionTrackedCoverageFields(trackedManifest, propagatablePopulation),
                source_urls: Array.isArray(metadata.source_urls) ? [...metadata.source_urls] : []
            };
        } catch (error) {
            console.warn('[conjunction] Catalog metadata is unavailable.', error);
            const snapshot = getActiveCatalogValidationSnapshot() || getLastCatalogValidationSnapshot();
            const provenance = snapshot?.provenance || {};
            const quality = snapshot?.quality || {};
            const retrievedAt = provenance.retrieved_at || null;
            const retrievedTime = retrievedAt ? Date.parse(retrievedAt) : NaN;
            const trackedManifest = await trackedManifestPromise;
            return {
                dataset_id: provenance.dataset_id || 'dataset:loaded-tle-catalog',
                dataset_hash: provenance.dataset_hash || null,
                retrieved_at: retrievedAt,
                ageDays: Number.isFinite(retrievedTime) ? Math.max(0, (Date.now() - retrievedTime) / 86_400_000) : null,
                provider: provenance.provider || 'Unknown source',
                source_id: provenance.source_id || 'loaded-tle-catalog',
                source_uri: provenance.source_uri || null,
                license_id: provenance.license_id || null,
                rejectedCount: Number(quality.quarantined_records) || 0,
                retainedCount: null,
                source_status: String(snapshot?.status || provenance.source_status || 'UNKNOWN').toUpperCase(),
                partial_update: snapshot?.status === 'PARTIAL' || provenance.partial_update !== false,
                quality,
                ...conjunctionTrackedCoverageFields(trackedManifest, propagatablePopulation),
                source_urls: []
            };
        }
    }

    async function syncConjunctionCatalog() {
        if (!conjunctionPanel) return;
        const catalog = satellites.map(satelliteScreeningRecord).filter(record => {
            const format = String(record?.element_set?.format ?? '').toUpperCase();
            return (record?.tle_line1 && record?.tle_line2) ||
                (record?.element_set?.line1 && record?.element_set?.line2) ||
                (format === 'OMM' && !!record?.element_set?.omm);
        });
        conjunctionCatalogMetadata = await loadConjunctionCatalogMetadata(catalog.length);
        conjunctionCatalogMetadata.staleCount = catalog.filter(record =>
            Array.isArray(record.quality_flags) && record.quality_flags.includes('TLE_STALE')
        ).length;
        conjunctionPanel.setCatalog(catalog, conjunctionCatalogMetadata);
        conjunctionPanel.setPrimary(satelliteScreeningRecord(currentSelectedSatellite));
        conjunctionPanel.setStartTime(SIM_DATE);
    }

    function createFullCatalogWorkspace() {
        const elements = {
            workspace: document.getElementById('fullCatalogWorkspace'),
            badge: document.getElementById('fullCatalogCapabilityBadge'),
            capabilityStatus: document.getElementById('fullCatalogCapabilityStatus'),
            refresh: document.getElementById('fullCatalogRefreshButton'),
            form: document.getElementById('fullCatalogJobForm'),
            token: document.getElementById('fullCatalogBearerToken'),
            run: document.getElementById('fullCatalogRunButton'),
            cancel: document.getElementById('fullCatalogCancelButton'),
            jobStatusBlock: document.getElementById('fullCatalogJobStatusBlock'),
            progress: document.getElementById('fullCatalogProgress'),
            status: document.getElementById('fullCatalogStatus'),
            jobId: document.getElementById('fullCatalogJobId'),
            jobState: document.getElementById('fullCatalogJobState'),
            jobStage: document.getElementById('fullCatalogJobStage'),
            eventCount: document.getElementById('fullCatalogEventCount'),
            coverage: document.getElementById('fullCatalogCoverage'),
            results: document.getElementById('fullCatalogResults'),
            resultRows: document.getElementById('fullCatalogResultRows'),
            resultsStatus: document.getElementById('fullCatalogResultsStatus')
        };
        if (!elements.workspace || !elements.form) return null;

        const client = createFullCatalogClient({ baseUrl: serverConnectionState.baseUrl || serverApiBaseUrl });
        let capability = null;
        let activeJob = null;
        let submitting = false;
        let disposed = false;
        let discoveryController = null;
        let watchController = null;

        const activeState = () => ['QUEUED', 'RUNNING', 'CANCEL_REQUESTED'].includes(
            String(activeJob?.state || '').toUpperCase()
        );

        const capabilityReadiness = () => {
            const feature = capability?.full_catalog_screening;
            return Boolean(
                feature?.enabled &&
                feature?.authenticated &&
                feature?.worker_running &&
                feature?.current_catalog_revision_id
            );
        };

        const updateActionAvailability = () => {
            const working = activeState();
            elements.run.disabled = submitting || working || !capabilityReadiness() || !client.hasToken();
            elements.cancel.disabled = submitting || !working || activeJob?.state === 'CANCEL_REQUESTED';
            elements.token.disabled = working;
        };

        const setCapabilityBadge = (label, state) => {
            elements.badge.textContent = label;
            elements.badge.dataset.state = state;
        };

        const renderCapability = () => {
            const feature = capability?.full_catalog_screening;
            if (!client.baseUrl) {
                setCapabilityBadge('Server required', 'unavailable');
                elements.capabilityStatus.textContent = 'Full-catalog jobs are unavailable in static mode.';
            } else if (!feature) {
                setCapabilityBadge('Unavailable', 'unavailable');
                elements.capabilityStatus.textContent = 'The connected server does not expose full-catalog screening.';
            } else if (!feature.enabled) {
                setCapabilityBadge('Disabled', 'unavailable');
                elements.capabilityStatus.textContent = 'Full-catalog screening is disabled on this server.';
            } else if (!feature.authenticated) {
                setCapabilityBadge('Auth unavailable', 'unavailable');
                elements.capabilityStatus.textContent = 'The server has no API credentials configured.';
            } else if (!feature.worker_running) {
                setCapabilityBadge('Worker offline', 'unavailable');
                elements.capabilityStatus.textContent = 'The full-catalog worker is not ready.';
            } else if (!feature.current_catalog_revision_id) {
                setCapabilityBadge('No catalog', 'unavailable');
                elements.capabilityStatus.textContent = 'No server catalog revision is available.';
            } else {
                setCapabilityBadge('Ready', 'ready');
                elements.capabilityStatus.textContent = `Server catalog ${feature.current_catalog_revision_id}`;
            }
            updateActionAvailability();
        };

        const refreshCapabilities = async () => {
            discoveryController?.abort();
            const controller = new AbortController();
            discoveryController = controller;
            setCapabilityBadge('Checking', 'checking');
            elements.capabilityStatus.textContent = 'Checking server capability.';
            elements.refresh.disabled = true;
            const timeout = setTimeout(() => controller.abort(), 3000);
            try {
                const discovered = await client.discoverCapabilities({ signal: controller.signal });
                if (disposed || discoveryController !== controller) return;
                capability = discovered;
                renderCapability();
            } catch (error) {
                if (disposed || discoveryController !== controller) return;
                capability = null;
                setCapabilityBadge('Server required', 'unavailable');
                if (error?.name === 'AbortError') {
                    elements.capabilityStatus.textContent = 'Full-catalog capability check timed out.';
                } else if (!error?.status || error.status === 404 || error.status === 503) {
                    elements.capabilityStatus.textContent = 'Full-catalog service unavailable; selected-object screening remains available.';
                } else {
                    elements.capabilityStatus.textContent = error?.message || 'Full-catalog service is unavailable.';
                }
                updateActionAvailability();
            } finally {
                clearTimeout(timeout);
                if (discoveryController === controller) discoveryController = null;
                if (!disposed) elements.refresh.disabled = false;
            }
        };

        const progressPercent = job => {
            const fraction = Number(job?.progress_fraction);
            return Number.isFinite(fraction) ? Math.max(0, Math.min(100, fraction * 100)) : 0;
        };

        const renderJob = (job, transport = '') => {
            if (!job) return;
            const previousJobId = activeJob?.job_id || null;
            activeJob = job;
            const state = String(job.state || 'UNKNOWN').toUpperCase();
            const percent = progressPercent(job);
            const resultCount = Number(job.result?.event_count);
            const scientificStatus = String(job.result?.summary?.status || '').toUpperCase();
            const unscreenedIntervals = Number(
                job.result?.summary?.statistics?.pair_intervals_unscreened
            );
            elements.jobStatusBlock.hidden = false;
            elements.progress.value = percent;
            elements.jobId.textContent = job.job_id || 'Unavailable';
            elements.jobState.textContent = state;
            elements.jobStage.textContent = job.progress_stage || (state === 'QUEUED' ? 'Waiting' : 'Unavailable');
            if (Number.isFinite(resultCount)) elements.eventCount.textContent = resultCount.toLocaleString();
            else if (previousJobId !== job.job_id) elements.eventCount.textContent = '0';
            if (scientificStatus === 'PARTIAL') {
                elements.coverage.textContent = Number.isFinite(unscreenedIntervals)
                    ? `Partial (${unscreenedIntervals.toLocaleString()} unscreened)`
                    : 'Partial';
            } else if (scientificStatus === 'COMPLETED') {
                elements.coverage.textContent = 'Complete';
            } else if (previousJobId !== job.job_id) {
                elements.coverage.textContent = 'Pending';
            }

            if (state === 'QUEUED') elements.status.textContent = 'Full-catalog job queued.';
            else if (state === 'RUNNING') elements.status.textContent = `Full-catalog job ${Math.round(percent)}% complete.`;
            else if (state === 'CANCEL_REQUESTED') elements.status.textContent = 'Cancellation requested.';
            else if (state === 'SUCCEEDED' && scientificStatus === 'PARTIAL') {
                elements.status.textContent = Number.isFinite(unscreenedIntervals)
                    ? `Job finished with partial coverage; ${unscreenedIntervals.toLocaleString()} pair intervals were not screened.`
                    : 'Job finished with partial screening coverage.';
            } else if (state === 'SUCCEEDED') elements.status.textContent = 'Full-catalog job completed with complete reported coverage.';
            else if (state === 'CANCELLED') elements.status.textContent = 'Full-catalog job cancelled.';
            else if (state === 'TIMED_OUT') elements.status.textContent = 'Full-catalog job timed out.';
            else if (state === 'FAILED') elements.status.textContent = job.error?.message || 'Full-catalog job failed.';
            else elements.status.textContent = `Full-catalog job state: ${state}.`;
            if (transport === 'poll') elements.status.dataset.transport = 'poll';
            updateActionAvailability();
        };

        const compactObjectId = objectId => String(objectId || 'Unknown').replace(/^obx:norad:/i, 'NORAD ');
        const formatEventTime = value => {
            const parsed = new Date(value);
            return Number.isFinite(parsed.getTime())
                ? parsed.toISOString().replace('T', ' ').replace('.000Z', 'Z')
                : 'Unavailable';
        };

        const selectServerEvent = event => {
            const normalized = normalizeFullCatalogEvent(event);
            const primary = satelliteForConjunctionObject(normalized.primary_object_id);
            const secondary = satelliteForConjunctionObject(normalized.secondary_object_id);
            if (!primary || !secondary) {
                elements.resultsStatus.textContent = 'Both event objects are not present in the browser catalog snapshot.';
                return;
            }
            showConjunctionEvent(normalized);
            elements.resultsStatus.textContent = `Displaying ${compactObjectId(normalized.primary_object_id)} and ${compactObjectId(normalized.secondary_object_id)} at TCA.`;
        };

        const renderEvents = ({ items, next_cursor: nextCursor }) => {
            const events = Array.isArray(items) ? items : [];
            elements.resultRows.replaceChildren();
            events.forEach(event => {
                const row = document.createElement('tr');
                const tcaCell = document.createElement('td');
                const eventButton = document.createElement('button');
                eventButton.type = 'button';
                eventButton.className = 'full-catalog-event-button';
                eventButton.textContent = formatEventTime(event.tca);
                eventButton.setAttribute(
                    'aria-label',
                    `Display event for ${compactObjectId(event.primary_object_id)} and ${compactObjectId(event.secondary_object_id)} at ${formatEventTime(event.tca)}`
                );
                eventButton.addEventListener('click', () => selectServerEvent(event));
                tcaCell.appendChild(eventButton);

                const pairCell = document.createElement('td');
                pairCell.textContent = `${compactObjectId(event.primary_object_id)} / ${compactObjectId(event.secondary_object_id)}`;
                const distanceCell = document.createElement('td');
                const distance = Number(event.miss_distance_km);
                distanceCell.textContent = Number.isFinite(distance) ? distance.toFixed(distance < 10 ? 3 : 1) : 'N/A';
                row.append(tcaCell, pairCell, distanceCell);
                elements.resultRows.appendChild(row);
            });
            elements.results.hidden = false;
            elements.eventCount.textContent = events.length.toLocaleString();
            if (!events.length) elements.resultsStatus.textContent = 'No close-approach events were returned for this job.';
            else if (nextCursor) elements.resultsStatus.textContent = `Showing the first ${events.length.toLocaleString()} events.`;
            else elements.resultsStatus.textContent = `${events.length.toLocaleString()} events loaded.`;
        };

        const loadCompletedEvents = async job => {
            const requestedLimit = Number(job?.request?.configuration?.max_results);
            const maxItems = Number.isFinite(requestedLimit)
                ? Math.max(1, Math.min(10000, Math.trunc(requestedLimit)))
                : 500;
            elements.resultsStatus.textContent = 'Loading full-catalog events.';
            const page = await client.loadJobEvents(job.job_id, { maxItems });
            if (!disposed && activeJob?.job_id === job.job_id) renderEvents(page);
        };

        const monitorJob = async job => {
            watchController?.abort();
            const controller = new AbortController();
            watchController = controller;
            try {
                const terminal = await client.watchJob(job.job_id, {
                    signal: controller.signal,
                    onJob: (update, context) => renderJob(update, context?.transport),
                    onStreamEvent: frame => {
                        if (frame.type === 'job.result') elements.status.textContent = 'Full-catalog result is available.';
                    }
                });
                renderJob(terminal);
                if (terminal.state === 'SUCCEEDED') await loadCompletedEvents(terminal);
            } catch (error) {
                if (!controller.signal.aborted && !disposed) {
                    elements.status.textContent = error?.message || 'Full-catalog job monitoring stopped.';
                }
            } finally {
                if (watchController === controller) watchController = null;
                updateActionAvailability();
            }
        };

        const buildRequestFromControls = () => {
            const screeningForm = document.getElementById('conjunctionScreeningForm');
            if (!screeningForm?.reportValidity()) throw new Error('Review the screening fields above.');
            const start = parseUtcDateTimeLocal(document.getElementById('conjunctionStartTime')?.value);
            return buildFullCatalogJobRequest({
                startTime: start,
                durationHours: document.getElementById('conjunctionDurationHours')?.value,
                coarseStepSeconds: document.getElementById('conjunctionCoarseStepSeconds')?.value,
                screeningRadiusKm: document.getElementById('conjunctionScreeningRadiusKm')?.value,
                refinementToleranceSeconds: document.getElementById('conjunctionRefinementToleranceSeconds')?.value,
                maxResults: document.getElementById('conjunctionMaxResults')?.value,
                catalogRevisionId: capability?.full_catalog_screening?.current_catalog_revision_id || 'current'
            });
        };

        elements.token.addEventListener('input', () => {
            client.setToken(elements.token.value);
            updateActionAvailability();
        });
        elements.refresh.addEventListener('click', () => void refreshCapabilities());
        elements.form.addEventListener('submit', async event => {
            event.preventDefault();
            if (submitting || activeState()) return;
            submitting = true;
            elements.results.hidden = true;
            elements.resultRows.replaceChildren();
            elements.status.textContent = 'Submitting full-catalog job.';
            elements.jobStatusBlock.hidden = false;
            updateActionAvailability();
            try {
                const request = buildRequestFromControls();
                const job = await client.submitJob(request, {
                    idempotencyKey: client.createIdempotencyKey()
                });
                renderJob(job);
                void monitorJob(job);
            } catch (error) {
                elements.status.textContent = error?.message || 'Full-catalog job submission failed.';
            } finally {
                submitting = false;
                updateActionAvailability();
            }
        });
        elements.cancel.addEventListener('click', async () => {
            if (!activeJob?.job_id || !activeState()) return;
            elements.cancel.disabled = true;
            elements.status.textContent = 'Requesting cancellation.';
            try {
                renderJob(await client.cancelJob(activeJob.job_id));
            } catch (error) {
                elements.status.textContent = error?.message || 'Cancellation request failed.';
                updateActionAvailability();
            }
        });

        void refreshCapabilities();
        return {
            refreshCapabilities,
            dispose() {
                disposed = true;
                discoveryController?.abort();
                watchController?.abort();
                client.clearToken();
                elements.token.value = '';
            }
        };
    }

    function initializeConjunctionWorkspace() {
        if (!EXPERIMENTAL_CONJUNCTION_SCREENING_ENABLED) {
            document.getElementById('conjunctionAccordionSection')?.setAttribute('hidden', '');
            console.info('[conjunction]', { type: 'feature-disabled', feature: 'experimental_conjunction_screening' });
            return;
        }
        conjunctionPropagationService = createMultiFormatPropagationService({ satelliteLib: satellite });
        conjunctionWorkerClient = createConjunctionWorkerClient();
        conjunctionLayer = createConjunctionVisualization(scene);
        conjunctionPanel = createConjunctionPanel({
            startScreening: (request, { onProgress }) => {
                conjunctionAbortController?.abort();
                const controller = new AbortController();
                conjunctionAbortController = controller;
                return conjunctionWorkerClient.screen(request, {
                    signal: controller.signal,
                    onProgress
                }).finally(() => {
                    if (conjunctionAbortController === controller) conjunctionAbortController = null;
                });
            },
            cancelScreening: () => {
                conjunctionAbortController?.abort();
            },
            onEventSelected: showConjunctionEvent,
            onPlaybackTimeChanged: updateConjunctionPlayback,
            onDiagnostic: diagnostic => console.info('[conjunction]', diagnostic)
        });
        fullCatalogWorkspace = createFullCatalogWorkspace();
        window.addEventListener('beforeunload', () => {
            fullCatalogWorkspace?.dispose();
            conjunctionPanel?.dispose();
            conjunctionWorkerClient?.terminate();
            conjunctionLayer?.dispose();
        }, { once: true });
    }

    function applyOrbitSelectionToUI(selection) {
        const normalized = normalizeTrackedOrbitSelection(selection);
        simParams.orbitTypeFilter = normalized;

        if (!orbitTypeFilterSelect) return;
        const isAllSelected = normalized.includes(ORBIT_ALL_OPTION);
        orbitTypeFilterSelect.querySelectorAll('button[data-orbit-filter]').forEach(button => {
            const value = button.dataset.orbitFilter;
            const isActive = value === ORBIT_ALL_OPTION
                ? isAllSelected
                : !isAllSelected && normalized.includes(value);
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
    }

    function applyObjectTypeSelectionToUI(selection) {
        const normalized = normalizeTrackedObjectTypeSelection(selection);
        simParams.objectTypeFilter = normalized;
        if (!objectTypeFilterSelect) return;
        const isAllSelected = normalized.includes(TRACKED_OBJECT_TYPE.ALL);
        objectTypeFilterSelect.querySelectorAll('button[data-object-type-filter]').forEach(button => {
            const value = button.dataset.objectTypeFilter;
            const isActive = value === TRACKED_OBJECT_TYPE.ALL
                ? isAllSelected
                : !isAllSelected && normalized.includes(value);
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
    }

    function normalizeCompanySelection(selection) {
        const cleaned = Array.from(new Set((selection || [])
            .filter(Boolean)
            .filter(value => !EXCLUDED_COMPANY_FILTER_OPTIONS.has(value.toString().trim().toUpperCase()))));

        if (cleaned.includes(ALL_COMPANY_OPTION) && cleaned.length > 1) {
            return cleaned.filter(val => val !== ALL_COMPANY_OPTION);
        }
        if (cleaned.length === 0) {
            return [ALL_COMPANY_OPTION];
        }
        return cleaned;
    }

    function getCompanySelectionFromUI() {
        if (!companyFilterSelect) return [...DEFAULT_COMPANY_FILTER];
        return Array.from(
            companyFilterSelect.querySelectorAll('input[type="checkbox"]:checked')
        ).map(cb => cb.value);
    }

    function applyCompanySelectionToUI(selection) {
        if (!companyFilterSelect) return;
        const normalized = normalizeCompanySelection(selection);
        companyFilterSelect.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.checked = normalized.includes(cb.value);
        });
        simParams.companyFilter = normalized;
    }

    function formatCompanyLabel(companyName) {
        if (COMPANY_LABEL_OVERRIDES[companyName]) return COMPANY_LABEL_OVERRIDES[companyName];
        return companyName
            .toLowerCase()
            .split(/[-_\s]+/)
            .filter(Boolean)
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ');
    }

    function createCompanyCheckbox(value, labelText) {
        const label = document.createElement('label');
        label.className = 'filter-chip';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = value;
        input.name = 'tagFilter';
        input.setAttribute('aria-label', labelText);

        const textSpan = document.createElement('span');
        textSpan.textContent = labelText;

        label.appendChild(input);
        label.appendChild(textSpan);

        return label;
    }

    function renderCompanyFilter(companies, previousSelection = simParams.companyFilter) {
        if (!companyFilterSelect) return;

        const normalizedSelection = normalizeCompanySelection(previousSelection);
        companyFilterSelect.innerHTML = '';

        const options = [ALL_COMPANY_OPTION, ...companies];
        options.forEach(companyName => {
            const checkbox = createCompanyCheckbox(companyName, formatCompanyLabel(companyName));
            companyFilterSelect.appendChild(checkbox);
        });

        applyCompanySelectionToUI(normalizedSelection);
    }

    function companyMatchesSelection(company) {
        const selection = normalizeCompanySelection(simParams.companyFilter);
        return selection.includes(ALL_COMPANY_OPTION) || selection.includes(company);
    }

    const TRACKED_POSITION_LABELS = Object.freeze({
        [TRACKED_POSITION_FILTER.ALL]: 'All positions',
        [TRACKED_POSITION_FILTER.POSITIONED]: 'Positioned',
        [TRACKED_POSITION_FILTER.METADATA_ONLY]: 'Position unavailable'
    });

    function isDebrisFacetContext() {
        const orbitSelection = normalizeTrackedOrbitSelection(simParams.orbitTypeFilter);
        const objectSelection = normalizeTrackedObjectTypeSelection(simParams.objectTypeFilter);
        return orbitSelection.length > 0 &&
            objectSelection.length === 1 && objectSelection[0] === TRACKED_OBJECT_TYPE.DEBRIS;
    }

    function activeTrackedFacets() {
        return isDebrisFacetContext() ? simParams.trackedFacets : null;
    }

    function activeTrackedCatalogDescriptors(manifest = trackedObjectCatalogLoader?.snapshot?.().manifest) {
        if (!manifest) return [];
        return [
            ...(Array.isArray(manifest.chunks) ? manifest.chunks : []),
            ...(simParams.includeHistoricalTrackedObjects && Array.isArray(manifest.history_chunks)
                ? manifest.history_chunks
                : [])
        ];
    }

    function trackedDebrisCoverageIsUsable() {
        const coverage = trackedObjectCatalogLoader?.coverage?.();
        if (!coverage?.manifest) return false;
        const debrisDescriptors = activeTrackedCatalogDescriptors(coverage.manifest)
            .filter(descriptor => trackedObjectType(descriptor) === TRACKED_OBJECT_TYPE.DEBRIS);
        if (!debrisDescriptors.length) return false;
        const loaded = new Set(coverage.loaded_chunk_ids ?? []);
        return debrisDescriptors.every((descriptor, index) => loaded.has(
            String(descriptor?.id ?? descriptor?.path ?? `chunk-${index}`)
        ));
    }

    function activeContextRequiresTrackedMembership() {
        return isDebrisFacetContext() && !trackedCatalogLineageBlocked && trackedDebrisCoverageIsUsable();
    }

    function recordParticipatesInActiveCatalogContext(record, requireTrackedCatalogMembership) {
        return !requireTrackedCatalogMembership || isTrackedCatalogMember(record);
    }

    function trackedDebrisFacetBaseRecords(records = allTrackedDisplayRecords()) {
        return records.filter(record => isTrackedCatalogMember(record) && trackedObjectMatchesFilters(record, {
            orbitSelection: simParams.orbitTypeFilter,
            objectTypeSelection: [TRACKED_OBJECT_TYPE.DEBRIS],
            tagSelection: simParams.companyFilter,
            allTagValue: ALL_COMPANY_OPTION,
            includeHistorical: simParams.includeHistoricalTrackedObjects
        }));
    }

    function formatTrackedFacetValue(value, key) {
        const text = String(value ?? '').trim();
        if (!text || text === 'UNKNOWN') return key === 'status' ? 'Unknown / not supplied' : 'Not reported';
        return text.replaceAll('_', ' ');
    }

    function facetSummaryText(key) {
        const selected = simParams.trackedFacets[key] || [];
        if (!selected.length) return 'All';
        if (selected.length === 1) return formatTrackedFacetValue(selected[0], key);
        return `${selected.length} selected`;
    }

    function updateTrackedFacetDisclosureSummary(key) {
        const target = trackedDebrisFacetsElement?.querySelector(`[data-facet-summary="${key}"]`);
        if (target) target.textContent = facetSummaryText(key);
    }

    function createTrackedFacetOption(key, value, count, labelText, checked) {
        const label = document.createElement('label');
        label.className = 'tracked-facet-option';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = value;
        input.checked = checked;
        input.dataset.trackedFacetKey = key;
        input.setAttribute('aria-label', `${labelText}, ${count.toLocaleString()} matches`);
        const text = document.createElement('span');
        text.textContent = `${labelText} (${count.toLocaleString()})`;
        label.append(input, text);
        return label;
    }

    function renderTrackedFacetOptionList(element, key, entries) {
        if (!element) return;
        const selected = simParams.trackedFacets[key] || [];
        const entryMap = new Map(entries.map(entry => [String(entry.value), entry]));
        selected.forEach(value => {
            if (!entryMap.has(value)) entryMap.set(value, { value, count: 0 });
        });
        const sortedEntries = [...entryMap.values()]
            .sort((a, b) => b.count - a.count || String(a.value).localeCompare(String(b.value)));
        const disclosure = element.closest('details');
        if (disclosure) disclosure.hidden = sortedEntries.length === 0;
        const total = sortedEntries.reduce((sum, entry) => sum + entry.count, 0);
        const fragment = document.createDocumentFragment();
        fragment.appendChild(createTrackedFacetOption(key, 'ALL', total, 'All', selected.length === 0));
        sortedEntries.forEach(entry => {
            fragment.appendChild(createTrackedFacetOption(
                key,
                String(entry.value),
                entry.count,
                formatTrackedFacetValue(entry.value, key),
                selected.includes(String(entry.value))
            ));
        });
        element.replaceChildren(fragment);
        updateTrackedFacetDisclosureSummary(key);
    }

    function renderTrackedSelectionFacet(element, key, entries, labels, allValue) {
        if (!element) return;
        const selected = simParams.trackedFacets[key];
        const counts = new Map(entries.map(entry => [entry.value, entry.count]));
        const total = entries.reduce((sum, entry) => sum + entry.count, 0);
        element.querySelectorAll('input[type="checkbox"]').forEach(input => {
            const value = input.value;
            input.checked = selected.includes(value);
            const count = value === allValue ? total : (counts.get(value) ?? 0);
            const text = input.nextElementSibling;
            if (text) text.textContent = `${labels[value] || value} (${count.toLocaleString()})`;
            input.dataset.trackedFacetKey = key;
        });
    }

    function renderTrackedRcsFacet(entries) {
        if (!trackedRcsFacetElement) return;
        const selected = simParams.trackedFacets.rcs;
        const total = entries.reduce((sum, entry) => sum + entry.count, 0);
        const fragment = document.createDocumentFragment();
        fragment.appendChild(createTrackedFacetOption(
            'rcs',
            TRACKED_RCS_FILTER.ALL,
            total,
            TRACKED_RCS_FILTER_LABELS[TRACKED_RCS_FILTER.ALL],
            selected.includes(TRACKED_RCS_FILTER.ALL)
        ));
        entries.forEach(entry => {
            fragment.appendChild(createTrackedFacetOption(
                'rcs',
                entry.value,
                entry.count,
                TRACKED_RCS_FILTER_LABELS[entry.value] || entry.value,
                selected.includes(entry.value)
            ));
        });
        trackedRcsFacetElement.replaceChildren(fragment);
        const active = selected.includes(TRACKED_RCS_FILTER.ALL) ? 'All' : `${selected.length} selected`;
        const summary = trackedDebrisFacetsElement?.querySelector('[data-facet-summary="rcs"]');
        if (summary) summary.textContent = active;
    }

    function renderTrackedLaunchYearFacet(entries) {
        const years = Array.from(new Set([
            ...entries.map(entry => Number(entry.value)).filter(Number.isInteger),
            simParams.trackedFacets.launchYearFrom,
            simParams.trackedFacets.launchYearTo
        ].filter(Number.isInteger))).sort((a, b) => a - b);
        const renderSelect = (element, selected, descending = false) => {
            if (!element) return;
            const values = descending ? [...years].reverse() : years;
            const fragment = document.createDocumentFragment();
            const anyOption = document.createElement('option');
            anyOption.value = '';
            anyOption.textContent = 'Any';
            fragment.appendChild(anyOption);
            values.forEach(year => {
                const option = document.createElement('option');
                option.value = String(year);
                option.textContent = String(year);
                fragment.appendChild(option);
            });
            element.replaceChildren(fragment);
            element.value = selected === null ? '' : String(selected);
        };
        renderSelect(trackedLaunchYearFromElement, simParams.trackedFacets.launchYearFrom);
        renderSelect(trackedLaunchYearToElement, simParams.trackedFacets.launchYearTo, true);
    }

    function renderTrackedDebrisFacetPanel(records = allTrackedDisplayRecords()) {
        if (!trackedDebrisFacetsElement) return;
        const visible = isDebrisFacetContext();
        trackedDebrisFacetsElement.hidden = !visible;
        trackedDebrisFacetsElement.setAttribute('aria-hidden', visible ? 'false' : 'true');
        if (!visible) return;

        simParams.trackedFacets = normalizeTrackedFacets(simParams.trackedFacets);
        const baseRecords = trackedDebrisFacetBaseRecords(records);
        const options = buildTrackedFacetOptions(baseRecords, simParams.trackedFacets);
        renderTrackedSelectionFacet(
            trackedPositionFacetElement,
            'position',
            options.position,
            TRACKED_POSITION_LABELS,
            TRACKED_POSITION_FILTER.ALL
        );
        renderTrackedRcsFacet(options.rcs);
        renderTrackedFacetOptionList(trackedOwnerFacetElement, 'owner', options.owner);
        renderTrackedFacetOptionList(trackedLaunchSiteFacetElement, 'launchSite', options.launchSite);
        renderTrackedFacetOptionList(trackedStatusFacetElement, 'status', options.status);
        renderTrackedLaunchYearFacet(options.launchYear);
        if (trackedDesignatorFacetElement && document.activeElement !== trackedDesignatorFacetElement) {
            trackedDesignatorFacetElement.value = simParams.trackedFacets.designator;
        }
    }

    function resetTrackedDebrisFacets() {
        simParams.trackedFacets = normalizeTrackedFacets(DEFAULT_TRACKED_FACETS);
        refreshFilteredSatelliteView();
    }

    function updateTrackedFacetFromCheckbox(input) {
        const key = input.dataset.trackedFacetKey;
        if (!key) return;
        if (key === 'position') {
            simParams.trackedFacets = normalizeTrackedFacets({
                ...simParams.trackedFacets,
                position: toggleTrackedFacetSelection(
                    simParams.trackedFacets.position,
                    input.value,
                    TRACKED_POSITION_FILTER_OPTIONS,
                    TRACKED_POSITION_FILTER.ALL
                )
            });
        } else if (key === 'rcs') {
            simParams.trackedFacets = normalizeTrackedFacets({
                ...simParams.trackedFacets,
                rcs: toggleTrackedFacetSelection(
                    simParams.trackedFacets.rcs,
                    input.value,
                    TRACKED_RCS_FILTER_OPTIONS,
                    TRACKED_RCS_FILTER.ALL
                )
            });
        } else if (['owner', 'launchSite', 'status'].includes(key)) {
            const next = input.value === 'ALL'
                ? []
                : input.checked
                    ? [...simParams.trackedFacets[key], input.value]
                    : simParams.trackedFacets[key].filter(value => value !== input.value);
            simParams.trackedFacets = normalizeTrackedFacets({ ...simParams.trackedFacets, [key]: next });
        }
        refreshFilteredSatelliteView();
    }

    function orbitMatchesSelection(satDataOrOrbitType, selection = simParams.orbitTypeFilter) {
        return trackedObjectMatchesFilters(satDataOrOrbitType, {
            orbitSelection: selection,
            objectTypeSelection: [TRACKED_OBJECT_TYPE.ALL],
            includeHistorical: true
        });
    }

    function allTrackedDisplayRecords() {
        const cacheKey = {
            orbitalLength: satellites.length,
            firstOrbital: satellites[0] ?? null,
            lastOrbital: satellites[satellites.length - 1] ?? null,
            trackedRecords: trackedCatalogRecords
        };
        if (combinedTrackedCatalogCacheKey &&
            combinedTrackedCatalogCacheKey.orbitalLength === cacheKey.orbitalLength &&
            combinedTrackedCatalogCacheKey.firstOrbital === cacheKey.firstOrbital &&
            combinedTrackedCatalogCacheKey.lastOrbital === cacheKey.lastOrbital &&
            combinedTrackedCatalogCacheKey.trackedRecords === cacheKey.trackedRecords) {
            return combinedTrackedCatalogCache;
        }
        combinedTrackedCatalogCache = mergeTrackedCatalogRecords(satellites, trackedCatalogRecords, {
            preserveOrbitalReferences: true
        });
        combinedTrackedCatalogCacheKey = cacheKey;
        return combinedTrackedCatalogCache;
    }

    function selectedObjectTypesNeedTrackedCatalog() {
        const selection = normalizeTrackedObjectTypeSelection(simParams.objectTypeFilter);
        return selection.includes(TRACKED_OBJECT_TYPE.ALL) ? [TRACKED_OBJECT_TYPE.ALL] : selection;
    }

    function setTrackedCatalogStatus(text, state = 'idle') {
        if (!trackedCatalogStatusElement) return;
        trackedCatalogStatusElement.textContent = text;
        trackedCatalogStatusElement.dataset.state = state;
    }

    async function ensureTrackedCatalogManifestReady() {
        if (trackedCatalogLineageBlocked || !TRACKED_CATALOG_FEATURE_ENABLED ||
            !trackedObjectCatalogLoader?.readManifest) return null;
        const generation = trackedCatalogRequestGeneration;
        setTrackedCatalogStatus('Loading tracked catalog summary...', 'loading');
        try {
            const manifest = await trackedObjectCatalogLoader.readManifest();
            if (generation !== trackedCatalogRequestGeneration) return manifest;
            const currentCount = Number(
                manifest?.counts?.current ?? manifest?.counts?.current_tracked ?? manifest?.counts?.current_records
            );
            setTrackedCatalogStatus(
                Number.isFinite(currentCount)
                    ? `${currentCount.toLocaleString()} current tracked records available on demand`
                    : 'Tracked catalog available on demand',
                'manifest'
            );
            updateSatelliteList();
            return manifest;
        } catch (error) {
            if (generation !== trackedCatalogRequestGeneration) return null;
            setTrackedCatalogStatus('Tracked catalog summary unavailable; using the orbital catalog', 'error');
            console.warn('[tracked-catalog]', error);
            return null;
        }
    }

    async function ensureTrackedCatalogLoaded(options = {}) {
        if (trackedCatalogLineageBlocked || !TRACKED_CATALOG_FEATURE_ENABLED || !trackedObjectCatalogLoader) return null;
        const generation = ++trackedCatalogRequestGeneration;
        const includeHistorical = options.includeHistorical === true || simParams.includeHistoricalTrackedObjects;
        setTrackedCatalogStatus(
            includeHistorical ? 'Loading current and historical tracked objects...' : 'Loading current tracked objects...',
            'loading'
        );
        try {
            const loadOptions = {
                includeHistorical,
                objectTypes: options.loadAll === true
                    ? [TRACKED_OBJECT_TYPE.ALL]
                    : selectedObjectTypesNeedTrackedCatalog(),
                onProgress: ({ processed_chunks, total_chunks, loaded_records }) => {
                    if (generation !== trackedCatalogRequestGeneration) return;
                    setTrackedCatalogStatus(
                        `Loading tracked catalog ${processed_chunks}/${total_chunks} chunks (${loaded_records.toLocaleString()} records)`,
                        'loading'
                    );
                }
            };
            const snapshot = options.force === true
                ? await trackedObjectCatalogLoader.reloadAll(loadOptions)
                : await trackedObjectCatalogLoader.load(loadOptions);
            if (generation !== trackedCatalogRequestGeneration || snapshot?.stale_request) return snapshot;
            trackedCatalogRecords = [...snapshot.records];
            const manifestCount = Number(snapshot.manifest?.counts?.total);
            const scopeLabel = includeHistorical ? 'current + history' : 'current';
            setTrackedCatalogStatus(
                `${trackedCatalogRecords.length.toLocaleString()} ${scopeLabel} tracked records loaded` +
                (Number.isFinite(manifestCount) && includeHistorical ? ` of ${manifestCount.toLocaleString()}` : ''),
                snapshot.state
            );
            updateSatelliteList();
            const trackedRevision = snapshot.manifest?.catalog_revision ?? snapshot.manifest?.revision ?? null;
            if (conjunctionPanel && trackedRevision &&
                conjunctionCatalogMetadata?.tracked_catalog_revision !== trackedRevision) {
                await syncConjunctionCatalog();
            }
            return snapshot;
        } catch (error) {
            if (generation !== trackedCatalogRequestGeneration) return null;
            const snapshot = trackedObjectCatalogLoader.snapshot();
            trackedCatalogRecords = [...snapshot.records];
            setTrackedCatalogStatus(
                trackedCatalogRecords.length
                    ? `Tracked catalog refresh failed; using ${trackedCatalogRecords.length.toLocaleString()} cached records`
                    : 'Tracked catalog unavailable; using the orbital catalog',
                trackedCatalogRecords.length ? 'stale' : 'error'
            );
            updateSatelliteList();
            if (options.throwOnFailure === true) throw error;
            console.warn('[tracked-catalog]', error);
            return snapshot;
        }
    }

    function scheduleTrackedCatalogSearchLoad(query) {
        if (!TRACKED_CATALOG_FEATURE_ENABLED || !String(query || '').trim()) return;
        clearTimeout(trackedCatalogSearchTimer);
        trackedCatalogSearchTimer = setTimeout(() => {
            void ensureTrackedCatalogLoaded({
                loadAll: true,
                includeHistorical: simParams.includeHistoricalTrackedObjects
            });
        }, 160);
    }

    function getCompaniesForOrbitSelection(orbitSelection) {
        if (!satellites) return [];
        const requireTrackedCatalogMembership = activeContextRequiresTrackedMembership();

        return Array.from(new Set(
            allTrackedDisplayRecords()
                .filter(s => recordParticipatesInActiveCatalogContext(s, requireTrackedCatalogMembership) &&
                    orbitMatchesSelection(s, orbitSelection) &&
                    trackedObjectMatchesFilters(s, {
                        orbitSelection,
                        objectTypeSelection: simParams.objectTypeFilter,
                        includeHistorical: simParams.includeHistoricalTrackedObjects
                    }))
                .flatMap(s => [
                    s.company,
                    s.operator,
                    ...(Array.isArray(s.tags) ? s.tags : [])
                ])
                .filter(tag => tag && tag !== 'N/A' &&
                    !EXCLUDED_COMPANY_FILTER_OPTIONS.has(tag.toString().trim().toUpperCase()))
        )).sort();
    }

    function refreshFilteredSatelliteView() {
        updateSatelliteList();
    }

    function exitFullscreenMercator() {
        if (!simParams.viewMercator || simParams.view3D) return;
        simParams.view3D = true;
        if (view3DToggle) view3DToggle.checked = true;
        mercatorContainer?.classList.remove('fullscreen');
        mercatorContainer?.classList.add('globe-overlay');
    }

    function handleMercatorFullscreenKeydown(event) {
        if (event.key === 'Escape' && mercatorContainer?.classList.contains('fullscreen')) {
            event.preventDefault();
            exitFullscreenMercator();
        }
    }

    function setTimelineButtonState(id, text, disabled = false) {
        const control = document.getElementById(id);
        if (!control) return;
        const labelText = control.closest('label')?.querySelector('span');
        if (labelText) {
            labelText.textContent = text;
        } else {
            control.textContent = text;
        }
        control.disabled = !!disabled;
        control.setAttribute('aria-busy', disabled ? 'true' : 'false');
    }

    function setSatelliteFoundCountLabel(text, ariaLabel = null) {
        if (!satelliteCountDisplay) return;
        const label = text?.toString() || '0';
        satelliteCountDisplay.textContent = label;
        satelliteCountDisplay.setAttribute('aria-label', ariaLabel || `Tracked-object catalog status: ${label}`);
    }

    function uniqueSatelliteCount(records) {
        return new Set((records || [])
            .map(record => record?.norad_id?.toString())
            .filter(Boolean)).size;
    }

    function activeTrackedCatalogCoverageIsPartial() {
        const snapshot = trackedObjectCatalogLoader?.snapshot?.();
        const manifest = snapshot?.manifest;
        if (!manifest) return false;
        const descriptors = activeTrackedCatalogDescriptors(manifest);
        const selectedTypes = normalizeTrackedObjectTypeSelection(simParams.objectTypeFilter);
        const relevant = selectedTypes.includes(TRACKED_OBJECT_TYPE.ALL)
            ? descriptors
            : descriptors.filter(descriptor => selectedTypes.includes(
                String(descriptor?.object_type ?? descriptor?.objectType ?? '').trim().toUpperCase()
            ));
        const loaded = new Set(snapshot.loaded_chunk_ids ?? []);
        return relevant.some((descriptor, index) => !loaded.has(
            String(descriptor?.id ?? descriptor?.path ?? `chunk-${index}`)
        ));
    }

    function activeTrackedCatalogDeclaredTotal() {
        const counts = trackedObjectCatalogLoader?.snapshot?.().manifest?.counts ?? {};
        const candidate = simParams.includeHistoricalTrackedObjects
            ? counts.total
            : (counts.current ?? counts.current_tracked ?? counts.current_records);
        const parsed = candidate === undefined || candidate === null ? NaN : Number(candidate);
        return Number.isInteger(parsed) && parsed > 0 ? parsed : null;
    }

    function setSatelliteCatalogCount(searchState = null) {
        const partialCoverage = activeTrackedCatalogCoverageIsPartial();
        const declaredTotal = activeTrackedCatalogDeclaredTotal();
        const catalogDenominator = declaredTotal ?? activeTotalSatelliteCount;
        const catalogContext = partialCoverage && declaredTotal !== null
            ? `${activeFilteredSatelliteCount} loaded / ${catalogDenominator} tracked`
            : `${activeFilteredSatelliteCount} / ${catalogDenominator}` + (partialCoverage ? ' loaded' : '');
        const filteredObjectPhrase = `${activeFilteredSatelliteCount} loaded ` +
            `object${activeFilteredSatelliteCount === 1 ? '' : 's'} ` +
            `${activeFilteredSatelliteCount === 1 ? 'matches' : 'match'} active filters`;
        const totalObjectPhrase = declaredTotal !== null
            ? `${declaredTotal} tracked catalog object${declaredTotal === 1 ? '' : 's'} declared` +
                (partialCoverage ? '; loaded coverage is incomplete' : '')
            : partialCoverage
                ? `${activeTotalSatelliteCount} currently loaded object${activeTotalSatelliteCount === 1 ? '' : 's'}; ` +
                    'additional tracked catalog records are available or loading'
                : `${catalogDenominator} loaded object${catalogDenominator === 1 ? '' : 's'}`;
        if (searchState?.query) {
            const searchContext = searchState.isCapped
                ? `${searchState.visibleCount} of ${searchState.totalCount} search`
                : `${searchState.totalCount} search`;
            setSatelliteFoundCountLabel(
                `${searchContext} | ${catalogContext}`,
                `${searchState.totalCount} loaded object${searchState.totalCount === 1 ? '' : 's'} ` +
                `${searchState.totalCount === 1 ? 'matches' : 'match'} the search query; ` +
                `${filteredObjectPhrase} out of ${totalObjectPhrase}.`
            );
            return;
        }
        setSatelliteFoundCountLabel(
            catalogContext,
            `${filteredObjectPhrase} out of ${totalObjectPhrase}.`
        );
    }

    function setTrackedCountValue(element, value) {
        if (element) element.textContent = Math.max(0, Number(value) || 0).toLocaleString();
    }

    function updateTrackedCatalogCountPanel(allRecords, filteredRecords, renderReadyOverride = null) {
        const validationQuarantine = Number(getActiveCatalogValidationSnapshot()?.quality?.quarantined_records ??
            getActiveCatalogValidationSnapshot()?.quarantine?.length ?? 0);
        const trackedSnapshot = trackedObjectCatalogLoader?.snapshot?.();
        const trackedQuarantine = Number(trackedSnapshot?.quarantine?.length ?? 0);
        const manifestQuarantine = Number(
            trackedSnapshot?.manifest?.quarantine?.count ??
            trackedSnapshot?.manifest?.counts?.quarantined ??
            trackedSnapshot?.manifest?.counts?.quarantine ?? 0
        );
        const trackedRecords = allRecords.filter(isTrackedCatalogMember);
        const filteredTrackedRecords = filteredRecords.filter(isTrackedCatalogMember);
        const counts = buildTrackedCatalogCounts(trackedRecords, filteredTrackedRecords, {
            quarantineCount: validationQuarantine + trackedQuarantine + manifestQuarantine,
            renderReadyPredicate: record => record?.mesh && satelliteMarkerCanRender(record)
        });
        const displayCounts = Number.isFinite(renderReadyOverride)
            ? { ...counts, render_ready: renderReadyOverride }
            : counts;
        const manifestCounts = trackedSnapshot?.manifest?.counts ?? {};
        const declaredCurrent = Number(
            manifestCounts.current ?? manifestCounts.current_tracked ?? manifestCounts.current_records
        );
        const declaredHistorical = Number(
            manifestCounts.history ?? manifestCounts.historical_tracked ?? manifestCounts.history_total
        );
        const declaredTotal = Number(manifestCounts.total);
        const scopeTotal = simParams.includeHistoricalTrackedObjects && Number.isFinite(declaredTotal)
            ? declaredTotal
            : (Number.isFinite(declaredCurrent) ? declaredCurrent : displayCounts.total);
        setTrackedCountValue(trackedCountTotalElement, scopeTotal);
        setTrackedCountValue(trackedCountFilteredElement, displayCounts.filtered);
        setTrackedCountValue(
            trackedCountCurrentElement,
            Number.isFinite(declaredCurrent) ? declaredCurrent : displayCounts.current_tracked
        );
        setTrackedCountValue(
            trackedCountHistoricalElement,
            Number.isFinite(declaredHistorical) ? declaredHistorical : displayCounts.historical_tracked
        );
        setTrackedCountValue(trackedCountPropagatableElement, displayCounts.propagatable);
        setTrackedCountValue(trackedCountMetadataOnlyElement, displayCounts.metadata_only);
        setTrackedCountValue(trackedCountRenderReadyElement, displayCounts.render_ready);
        setTrackedCountValue(trackedCountQuarantineElement, displayCounts.quarantine);
        if (trackedDebrisFacetSummaryElement && isDebrisFacetContext()) {
            trackedDebrisFacetSummaryElement.textContent =
                `${displayCounts.filtered.toLocaleString()} ${displayCounts.filtered === 1 ? 'match' : 'matches'} | ` +
                `${displayCounts.propagatable.toLocaleString()} positioned | ` +
                `${displayCounts.metadata_only.toLocaleString()} position unavailable`;
        }
        const coveragePresentation = buildTrackedCoveragePresentation({
            counts: displayCounts,
            manifest: trackedSnapshot?.manifest,
            snapshotState: trackedCatalogStatusElement?.dataset?.state ?? trackedSnapshot?.state,
            lineageBlocked: trackedCatalogLineageBlocked,
            includeHistorical: simParams.includeHistoricalTrackedObjects
        });
        if (trackedCoverageHudElement) {
            trackedCoverageHudElement.hidden = !coveragePresentation.visible || simParams.solarSystemOverview;
            trackedCoverageHudElement.dataset.state = coveragePresentation.state.key;
            trackedCoverageHudElement.setAttribute('aria-label', coveragePresentation.ariaLabel);
        }
        if (trackedCoverageStateElement) trackedCoverageStateElement.textContent = coveragePresentation.state.label;
        setTrackedCountValue(trackedCoverageMatchedElement, coveragePresentation.matched);
        setTrackedCountValue(trackedCoveragePositionedElement, coveragePresentation.positioned);
        setTrackedCountValue(trackedCoverageUnavailableElement, coveragePresentation.unavailable);
        if (trackedCoverageScopeElement) trackedCoverageScopeElement.textContent = coveragePresentation.scope;
        if (trackedCoverageTimestampElement) {
            trackedCoverageTimestampElement.textContent = coveragePresentation.timestamp;
            trackedCoverageTimestampElement.dateTime = coveragePresentation.timestamp;
            trackedCoverageTimestampElement.hidden = !coveragePresentation.timestamp;
        }
        lastTrackedRenderReadyCount = displayCounts.render_ready;
        return displayCounts;
    }

    async function initializeLaunchTimelineDeferred() {
        if (launchTimelineInitialized || launchTimelineInitializing) return;
        launchTimelineInitializing = true;
        startupPerf.mark('launch-timeline-init-start');
        try {
            const launchRecords = await loadLaunchCatalog();
            launchTimelineHandle = initTimeline(satellites, handleTimelineSelection, { launchRecords });
            launchTimelineInitialized = true;
            setTimelineButtonState('launchTimelineToggle', 'Show Launch Timeline', false);
            startupPerf.mark('launch-timeline-ready', { count: launchRecords.length });
        } finally {
            launchTimelineInitializing = false;
        }
    }

    async function initializeReentryTimelineDeferred() {
        if (reentryTimelineHandle || reentryTimelineInitializing) return;
        reentryTimelineInitializing = true;
        try {
            startupPerf.mark('decay-data-load-start');
            const confirmedDecays = await loadConfirmedDecays();
            startupPerf.mark('decay-data-ready', { confirmed: confirmedDecays?.size || 0 });

            const estimateDate = new Date();
            let activeConfirmed = 0;
            satellites.forEach((sat) => {
                if (applyConfirmedDecayRecord(sat, confirmedDecays)) {
                    activeConfirmed += 1;
                }
            });

            reentryTimelineHandle = initReentryTimeline(satellites, handleTimelineSelection, { confirmedDecays });
            if (reentryTimelineHandle?.refreshData) {
                reentryTimelineHandle.refreshData(confirmedDecays);
            }
            setTimelineButtonState('reentryTimelineToggle', 'Show Re-entry Timeline', false);
            startupPerf.mark('reentry-timeline-ready', {
                count: satellites.length,
                confirmed: confirmedDecays?.size || 0,
                activeConfirmed
            });

            const candidates = satellites.filter((sat) => isLikelyDecayCandidate(sat, { confirmedDecays, now: estimateDate }));
            let cachedPredictions = 0;
            const predictionCandidates = candidates.filter((sat) => {
                if (applyCachedDecayPrediction(sat, { confirmedDecays, now: estimateDate })) {
                    cachedPredictions += 1;
                    return false;
                }
                return true;
            });

            if (cachedPredictions && reentryTimelineHandle?.refreshData) {
                reentryTimelineHandle.refreshData(confirmedDecays);
            }

            startupPerf.mark('decay-estimates-start', {
                count: predictionCandidates.length,
                candidates: candidates.length,
                cached: cachedPredictions
            });

            if (!predictionCandidates.length) {
                startupPerf.mark('decay-estimates-ready', {
                    count: 0,
                    candidates: candidates.length,
                    cached: cachedPredictions
                });
                startupPerf.logSummary();
                return;
            }

            reentryTimelineHandle?.setStatusNote?.('Confirmed decay data loaded; prediction still updating');
            let lastProgressUpdate = 0;
            await processInChunks(
                predictionCandidates,
                (sat) => {
                    computeDecayEstimates([sat], { confirmedDecays, now: estimateDate });
                    cacheDecayPrediction(sat, { confirmedDecays, now: estimateDate });
                },
                {
                    chunkSize: DECAY_ESTIMATE_CHUNK_SIZE,
                    afterChunk: ({ processed, total }) => {
                        const now = performance.now();
                        if (now - lastProgressUpdate > 500 || processed === total) {
                            lastProgressUpdate = now;
                            reentryTimelineHandle?.setStatusNote?.(
                                `Confirmed decay data loaded; prediction still updating ${processed + cachedPredictions}/${total + cachedPredictions}`
                            );
                            if (processed === total && reentryTimelineHandle?.refreshData) {
                                reentryTimelineHandle.refreshData(confirmedDecays);
                            }
                        }
                    }
                }
            );

            reentryTimelineHandle?.setStatusNote?.('');
            if (reentryTimelineHandle?.refreshData) {
                reentryTimelineHandle.refreshData(confirmedDecays);
            }
            startupPerf.mark('decay-estimates-ready', {
                count: predictionCandidates.length,
                candidates: candidates.length,
                cached: cachedPredictions
            });
            startupPerf.logSummary();
        } finally {
            reentryTimelineInitializing = false;
        }
    }

    function buildFilteredSatellitesBySelection(options = {}) {
        const indexByNoradId = new Map();
        const filtered = [];
        const includeHistorical = options.includeHistorical === true || simParams.includeHistoricalTrackedObjects;
        const requireTrackedCatalogMembership = activeContextRequiresTrackedMembership();

        allTrackedDisplayRecords().forEach((s) => {
            if (!recordParticipatesInActiveCatalogContext(s, requireTrackedCatalogMembership)) return;
            const matchesCatalogFilters = trackedObjectMatchesFilters(s, {
                orbitSelection: simParams.orbitTypeFilter,
                objectTypeSelection: simParams.objectTypeFilter,
                tagSelection: simParams.companyFilter,
                allTagValue: ALL_COMPANY_OPTION,
                includeHistorical,
                facets: isTrackedCatalogMember(s) ? activeTrackedFacets() : null
            });

            if (!matchesCatalogFilters) return;

            const noradKey = s.norad_id?.toString();
            if (!noradKey) return;

            if (!indexByNoradId.has(noradKey)) {
                indexByNoradId.set(noradKey, filtered.length);
                filtered.push(s);
            } else if (s === currentSelectedSatellite) {
                filtered[indexByNoradId.get(noradKey)] = s;
            }
        });

        return filtered;
    }

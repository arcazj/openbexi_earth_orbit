    function positionSatelliteSearchResults() {
        if (!satelliteSearchInput || !satelliteSearchResults || satelliteSearchResults.hidden) return;
        const rect = satelliteSearchInput.getBoundingClientRect();
        const viewportPadding = 10;
        const availableBelow = window.innerHeight - rect.bottom - viewportPadding;
        const availableAbove = rect.top - viewportPadding;
        const openAbove = availableBelow < 150 && availableAbove > availableBelow;
        const availableHeight = Math.max(120, Math.min(260, openAbove ? availableAbove : availableBelow));
        const width = Math.min(rect.width, window.innerWidth - viewportPadding * 2);
        const left = Math.min(
            Math.max(rect.left, viewportPadding),
            Math.max(viewportPadding, window.innerWidth - width - viewportPadding)
        );
        const top = openAbove
            ? Math.max(viewportPadding, rect.top - availableHeight - 4)
            : Math.min(rect.bottom + 4, window.innerHeight - viewportPadding - 44);

        satelliteSearchResults.style.position = 'fixed';
        satelliteSearchResults.style.left = `${left}px`;
        satelliteSearchResults.style.top = `${top}px`;
        satelliteSearchResults.style.width = `${width}px`;
        satelliteSearchResults.style.maxHeight = `${availableHeight}px`;
        satelliteSearchResults.dataset.placement = openAbove ? 'above' : 'below';
    }

    function renderSatelliteSearchResults(filteredTLEs = buildFilteredSatellitesBySelection(), forceOpen = false) {
        if (!satelliteSearchInput || !satelliteSearchResults) return;
        if (forceOpen) isSatelliteDropdownOpen = true;

        const selectedLabelIsNotQuery = !!currentSelectedSatellite &&
            satelliteSearchPendingClearForNextSelection &&
            satelliteSearchInput.value === satelliteSearchLabel(currentSelectedSatellite);
        const effectiveQuery = selectedLabelIsNotQuery ? '' : satelliteSearchInput.value;
        const searchableRecords = String(effectiveQuery || '').trim()
            ? buildFilteredSatellitesBySelection({ includeHistorical: true })
            : filteredTLEs;
        const searchState = buildSatelliteSearchMatches(
            searchableRecords,
            effectiveQuery,
            {
            limit: SATELLITE_SEARCH_LIMIT,
            emptyQueryPreviewLimit: 12
            }
        );
        const query = searchState.query;

        currentSearchResults = searchState.visibleMatches;
        if (activeSearchResultIndex >= currentSearchResults.length) activeSearchResultIndex = currentSearchResults.length - 1;
        if (activeSearchResultIndex < -1) activeSearchResultIndex = -1;
        setSatelliteCatalogCount(searchState);

        satelliteSearchResults.innerHTML = '';
        currentSearchResults.forEach((sat, index) => {
            const item = document.createElement('li');
            item.id = `satelliteSearchOption-${index}`;
            item.className = `satellite-search-option${index === activeSearchResultIndex ? ' is-active' : ''}`;
            item.setAttribute('role', 'option');
            item.setAttribute('aria-selected', index === activeSearchResultIndex ? 'true' : 'false');
            item.dataset.noradId = sat.norad_id;
            const title = document.createElement('strong');
            title.textContent = satelliteSearchLabel(sat);
            const meta = document.createElement('small');
            meta.textContent = `NORAD ${sat.norad_id || 'N/A'} | ${sat.orbit_class || sat.orbitType || 'Unknown orbit'} | ` +
                `${sat.company || sat.operator || 'Unassigned'}`;
            item.append(title, meta);
            const badges = satelliteSearchBadges(sat);
            if (badges.length) {
                const badgeRow = document.createElement('span');
                badgeRow.className = 'satellite-search-badges';
                badges.forEach(label => {
                    const badge = document.createElement('span');
                    badge.className = 'satellite-search-badge';
                    badge.textContent = label;
                    badgeRow.appendChild(badge);
                });
                item.appendChild(badgeRow);
            }
            item.addEventListener('mousedown', (event) => {
                event.preventDefault();
                selectSatelliteFromSearch(index);
            });
            satelliteSearchResults.appendChild(item);
        });

        const hasResults = currentSearchResults.length > 0;
        const shouldOpen = hasResults && isSatelliteDropdownOpen;
        satelliteSearchResults.hidden = !hasResults || !shouldOpen;
        if (!satelliteSearchResults.hidden) positionSatelliteSearchResults();
        satelliteSearchInput.setAttribute('aria-expanded', !satelliteSearchResults.hidden ? 'true' : 'false');
        if (activeSearchResultIndex >= 0 && !satelliteSearchResults.hidden) {
            satelliteSearchInput.setAttribute('aria-activedescendant', `satelliteSearchOption-${activeSearchResultIndex}`);
        } else {
            satelliteSearchInput.removeAttribute('aria-activedescendant');
        }
        if (satelliteSearchEmpty) {
            satelliteSearchEmpty.hidden = !(query.length > 0 && !hasResults);
        }
    }

    function satelliteDetailRows(satData) {
        if (!satData) return [];
        const meta = satData.meta ?? {};
        const decay = satData.decay ?? {};
        const elementSet = satData.element_set ?? satData.catalogObject?.element_set ?? {};
        const internationalDesignator = satData.international_designator ??
            satData.catalogObject?.international_designator ??
            elementSet.omm?.OBJECT_ID;
        const objectId = decay.object_id ?? satData.object_id ?? meta.object_id;
        const displayedInternationalDesignator = internationalDesignator ?? objectId;
        const rows = [
            ['NORAD ID', satData.norad_id ?? meta.norad_id],
            ['International designator', displayedInternationalDesignator],
            ['Orbit type', satData.orbitType ?? satData.orbit_class ?? satData.type ?? meta.orbital_slot?.nominal],
            ['Inclination (deg)', satData.inclination_deg ?? satData.inclination ?? elementSet.omm?.INCLINATION],
            ['Eccentricity', satData.eccentricity ?? elementSet.omm?.ECCENTRICITY],
            ['Mean motion (rev/day)', satData.mean_motion ?? satData.mean_motion_rev_per_day ?? elementSet.omm?.MEAN_MOTION],
            ['Owner / operator', satData.owner ?? satData.company ?? satData.operator ?? meta.operator ?? meta.manufacturer],
            ['Launch date', satData.launch_date ?? meta.launch_date],
            ['Launch site', decay.launch_site ?? satData.launch_site ?? meta.launch_site],
            ['Lifecycle status', satData.lifecycle_status ?? satData.operational_status ?? meta.lifecycle_status],
            ['Decay status', decay.decay_status ?? satData.decay_status],
            ['Decay date', decay.decay_date ?? satData.decay_date],
            ['Object type', satData.object_type ?? meta.object_type],
            ['Radar cross section (m2)', satData.rcs_m2 ?? satData.rcs ?? 'Not reported'],
            ['RCS reporting status', satData.rcs_status ?? satData.rcs_size ?? 'Unknown'],
            ['Position status', isTrackedRecordPropagatable(satData) ? 'Current orbital elements' : 'No current orbital elements'],
            ['Position unavailable reason', satData.unavailable_reason ?? satData.no_current_elements_reason],
            ['Tracking status', satData.observation_status ?? satData.tracked_observation_status ?? satData.presence_status],
            ['Element format', elementSet.format ?? satData.source_format],
            ['Element epoch', elementSet.epoch],
            ['App satellite id', satData.satellite_id ?? satData.satelliteId ?? satData.id ?? meta.satellite_id ?? meta.satelliteId ?? meta.id]
        ];
        const seen = new Set(rows.map(([label]) => label.toLowerCase()));
        const addScalarRows = (source, prefix = '') => {
            Object.entries(source || {}).forEach(([key, value]) => {
                if (value === undefined || value === null || value === '' || typeof value === 'object') return;
                if (isDuplicateSelectedDetailKey(key)) return;
                const label = prefix ? `${prefix}.${key}` : key;
                const normalized = label.toLowerCase();
                if (seen.has(normalized)) return;
                seen.add(normalized);
                rows.push([label, value]);
            });
        };
        addScalarRows(satData);
        addScalarRows(meta, 'meta');
        return rows.filter(([, value]) => hasSatelliteDetailValue(value));
    }

    function selectedSatelliteModelSourceDetail(satData) {
        if (!satData) return null;
        const modelResolution = resolveSatelliteModel(satData);
        const assetId = String(modelResolution?.assetId || '').toLowerCase();
        const metadataId = String(modelResolution?.metadataId || '').toLowerCase();
        if (modelResolution?.found && (
            assetId.includes('starlink') ||
            metadataId.includes('starlink') ||
            isStarlinkSatelliteData(satData)
        )) {
            return 'Model downloaded from https://sketchfab.com/malacodart, license: CC Attribution / Creative Commons Attribution.';
        }
        if (modelResolution?.found && (
            assetId === ISS_MODEL_ASSET_ID.toLowerCase() ||
            metadataId === 'iss' ||
            isIssSatelliteData(satData)
        )) {
            return 'Model downloaded from https://github.com/nasa/NASA-3D-Resources, courtesy: NASA (National Aeronautics and Space Administration).';
        }
        return null;
    }

    function syncSelectedSatelliteDetailPanelWidth() {
        const clockEl = document.getElementById("utcClockDisplay");
        const clockRect = clockEl?.getBoundingClientRect?.();
        const timeControlsRect = document.getElementById('timeWarpBox')?.getBoundingClientRect?.();
        const clockWidth = Math.ceil(clockRect?.width || 0);
        const clockRight = clockRect ? Math.max(0, Math.ceil(window.innerWidth - clockRect.right)) : 16;
        const panelAnchorBottom = Math.max(clockRect?.bottom || 0, timeControlsRect?.bottom || 0);
        const panelTop = panelAnchorBottom ? Math.ceil(panelAnchorBottom + 14) : 52;
        if (clockWidth > 0) {
            [
                selectedSatelliteDetailPanel,
                solarSystemPlanetHudElement || document.getElementById('solarSystemPlanetHud')
            ].filter(Boolean).forEach((panel) => {
                panel.style.width = `${clockWidth}px`;
                panel.style.right = `${clockRight}px`;
                panel.style.top = `${panelTop}px`;
            });
        }
    }

        const elementFormat = String(elementSet.format ?? '').toUpperCase();

    async function loadPreferredServerCatalog(baseUrl) {
        try {
            const [records, metadata] = await Promise.all([
                loadGpDataFromServer({ baseUrl }),
                loadGpMetadataFromServer({ baseUrl })
            ]);
            return {
                records,
                metadata,
                kind: 'GP'
            };
        } catch (gpError) {
            console.warn('[server] GP endpoint is unavailable; trying the deprecated TLE endpoint.', gpError);
            const [records, metadata] = await Promise.all([
                loadTleDataFromServer({ baseUrl }),
                loadTleMetadataFromServer({ baseUrl })
            ]);
            return {
                records,
                metadata,
                kind: 'TLE'
            };
        }
    }

    async function checkAndLoadServerCatalogData() {
        if (!serverConnectionState.baseUrl) {
            setServerConnectionState({
                state: 'disconnected',
                connected: false,
                dataSource: 'packaged static catalog',
                error: null
            });
            return null;
        }
        setServerConnectionState({
            state: 'checking',
            connected: false,
            dataSource: 'checking server',
            error: null
        });

        const connection = await checkServerConnectionWithFallback({ baseUrl: serverConnectionState.baseUrl });
        if (!connection.connected) {
            console.info('[server] Python server unavailable. Using local satellite data.', connection.error);
            setServerConnectionState({
                ...connection,
                dataSource: 'local files'
            });
            return null;
        }

        setServerConnectionState({
            ...connection,
            dataSource: 'loading server data'
        });

        try {
            const { records, metadata, kind } = await loadPreferredServerCatalog(connection.baseUrl);
            console.info(`[server] Loaded ${records.length} ${kind} records from Python server.`);
            setServerConnectionState({
                state: 'connected',
                connected: true,
                baseUrl: connection.baseUrl,
                version: connection.version,
                dataSource: 'live server',
                lastSync: new Date(),
                error: null
            });
            return { records, metadata, kind };
        } catch (err) {
            console.warn('[server] Server GP/TLE data failed validation or loading. Falling back to local data.', err);
            setServerConnectionState({
                state: 'error',
                connected: false,
                baseUrl: connection.baseUrl,
                version: connection.version,
                dataSource: 'local files',
                error: err?.message || String(err)
            });
            return null;
        }
    }

    async function loadAuxiliaryCatalogs(revision = null, { staticSource = false } = {}) {
        const baseUrl = serverConnectionState.baseUrl;
        const launchSource = !staticSource && baseUrl
            ? resolveServerDataUrl('json/launches/launches.json', baseUrl)
            : null;
        const decaySource = !staticSource && baseUrl
            ? resolveServerDataUrl('json/decayed/decayed.json', baseUrl)
            : null;
        const [launchRecords, confirmedDecays] = await Promise.all([
            loadLaunchCatalog({ force: true, ...(launchSource ? { source: launchSource } : {}) }),
            loadConfirmedDecays({ force: true, revision, ...(decaySource ? { source: decaySource } : {}) })
        ]);
        return { launchRecords, confirmedDecays };
    }

    function applyAuxiliaryCatalogs({ launchRecords, confirmedDecays }) {
        launchTimelineHandle?.refreshData?.(launchRecords, satellites);
        satellites.forEach(satelliteData => applyConfirmedDecayRecord(satelliteData, confirmedDecays));
        reentryTimelineHandle?.refreshData?.(confirmedDecays, satellites);
        return { launchRecords, confirmedDecays };
    }

    async function refreshAuxiliaryCatalogs(revision = null, options = {}) {
        return applyAuxiliaryCatalogs(await loadAuxiliaryCatalogs(revision, options));
    }

    function statusDatasetRevision(status, name) {
        const value = status?.[`${name}_revision`] ?? status?.datasets?.[name]?.revision;
        return value == null ? null : String(value);
    }

    function statusOrbitalRevision(status) {
        const value = status?.orbital_revision ?? statusDatasetRevision(status, 'gp') ??
            statusDatasetRevision(status, 'tle') ?? status?.catalog_revision;
        return value == null ? null : String(value);
    }

    function statusTrackedRevision(status) {
        const value = status?.tracked_revision ?? statusDatasetRevision(status, 'tracked');
        return value == null ? null : String(value);
    }

    function trackedStatusIsIncoherent(status) {
        return status?.tracked_pointer_valid === false ||
            status?.tracked_source_revision_match === false ||
            status?.tracked_revision_match === false;
    }

    function clearTrackedCatalogOverlay(message = 'Tracked catalog unavailable; using the orbital catalog') {
        trackedCatalogRequestGeneration += 1;
        trackedCatalogLineageBlocked = true;
        restoreOrbitalRecordsAfterTrackedOverlay(satellites);
        trackedObjectCatalogLoader?.clear?.();
        trackedCatalogRecords = [];
        combinedTrackedCatalogCache = [];
        combinedTrackedCatalogCacheKey = null;
        simParams.trackedFacets = normalizeTrackedFacets(DEFAULT_TRACKED_FACETS);
        setTrackedCatalogStatus(message, 'lineage-error');

    }

    async function refreshCatalogForRevision({ revision, previous, status, previousStatus }) {
        if (catalogRefreshInProgress) throw new Error('A catalog refresh is already in progress.');
        if (!scene) throw new Error('The orbital scene is not ready for catalog refresh.');
        catalogRefreshInProgress = true;
        const selectedNorad = currentSelectedSatellite?.norad_id?.toString() || null;
        const staticSource = status?.source === 'static-metadata';
        const currentOrbitalRevision = statusOrbitalRevision(status);
        const previousOrbitalRevision = statusOrbitalRevision(previousStatus);
        const refreshOrbitalCatalog = !currentOrbitalRevision || !previousOrbitalRevision ||
            currentOrbitalRevision !== previousOrbitalRevision;
        const currentTrackedRevision = statusTrackedRevision(status);
        const previousTrackedRevision = statusTrackedRevision(previousStatus);
        const hadTrackedManifest = !!trackedObjectCatalogLoader?.snapshot?.().manifest;
        const trackedLineageIncoherent = trackedStatusIsIncoherent(status) ||
            (refreshOrbitalCatalog && (
                !currentTrackedRevision ||
                (previousTrackedRevision && currentTrackedRevision === previousTrackedRevision)
            ));
        const refreshTrackedCatalog = TRACKED_CATALOG_FEATURE_ENABLED && !trackedLineageIncoherent && (
            hadTrackedManifest
                ? (!currentTrackedRevision || !previousTrackedRevision || currentTrackedRevision !== previousTrackedRevision)
                : !!currentTrackedRevision
        );
        try {
            console.info(`[catalog] Revision changed from ${previous} to ${revision}; refreshing orbital and timeline data.`);
            if (hadTrackedManifest && (trackedLineageIncoherent || (refreshOrbitalCatalog && refreshTrackedCatalog))) {
                clearTrackedCatalogOverlay(
                    trackedLineageIncoherent
                        ? 'Tracked catalog lineage does not match the orbital catalog; using GP data only'
                        : 'Refreshing tracked catalog lineage; using GP data until reconciliation completes'
                );
            }
            const orbitalCatalogPromise = !refreshOrbitalCatalog
                ? Promise.resolve({ kind: 'UNCHANGED', records: null })
                : staticSource
                ? Promise.resolve({ kind: 'STATIC', records: null })
                : loadPreferredServerCatalog(serverConnectionState.baseUrl);
            const [orbitalOutcome, auxiliaryCatalogs] = await Promise.all([
                orbitalCatalogPromise.then(value => ({ value }), error => ({ error })),
                loadAuxiliaryCatalogs(revision, { staticSource })
            ]);

            let orbitalRefreshError = orbitalOutcome.error || null;
            if (!orbitalRefreshError && orbitalOutcome.value.kind !== 'UNCHANGED') {
                try {
                    const setupOptions = {
                        forceCatalogRefresh: true,
                        throwOnFailure: true,
                        chunkSize: SATELLITE_SETUP_CHUNK_SIZE,
                        onProgress: ({ processed, total }) => setSatelliteFoundCountLabel(`Refreshing ${processed}/${total}`)
                    };
                    if (orbitalOutcome.value.kind === 'GP') {
                        setupOptions.gpDataOverride = orbitalOutcome.value.records;
                        setupOptions.gpMetaOverride = orbitalOutcome.value.metadata;
                        setupOptions.gpDataSource = 'live server revision';
                    } else if (orbitalOutcome.value.kind === 'TLE') {
                        setupOptions.tleDataOverride = orbitalOutcome.value.records;
                        setupOptions.tleMetaOverride = orbitalOutcome.value.metadata;
                        setupOptions.tleDataSource = 'live server revision';
                    }
                    await setupTLESatellites(scene, setupOptions);
                    updateSatelliteList();
                    await syncConjunctionCatalog();
                } catch (error) {
                    orbitalRefreshError = error;
                }
            }

            applyAuxiliaryCatalogs(auxiliaryCatalogs);
            if (refreshTrackedCatalog) {
                trackedCatalogLineageBlocked = false;
                try {
                    await ensureTrackedCatalogLoaded({
                        force: true,
                        loadAll: true,
                        includeHistorical: simParams.includeHistoricalTrackedObjects,
                        throwOnFailure: true
                    });
                } catch (trackedError) {
                    if (!refreshOrbitalCatalog && !trackedStatusIsIncoherent(status)) throw trackedError;
                    clearTrackedCatalogOverlay(
                        'Tracked catalog could not be reconciled with the refreshed orbital catalog; using GP data only'
                    );
                    updateSatelliteList();
                    console.warn('[tracked-catalog] Incoherent tracked overlay was dropped.', trackedError);
                }
            }
            if (orbitalRefreshError) throw orbitalRefreshError;
            if (selectedNorad && refreshOrbitalCatalog) {
                const restored = buildFilteredSatellitesBySelection()
                    .find(s => s.norad_id?.toString() === selectedNorad);
                if (restored) selectSatelliteViaShortcut(restored);
            }
            setServerConnectionState({
                state: staticSource ? 'disconnected' : 'connected',
                connected: !staticSource,
                dataSource: staticSource ? 'packaged static catalog' : 'live server',
                lastSync: new Date(),
                error: null
            });
        } catch (error) {
            console.error('[catalog] Revision refresh failed; the last usable catalog remains active.', error);
            setServerConnectionState({
                state: staticSource ? 'disconnected' : 'connected',
                connected: !staticSource,
                dataSource: 'last known good catalog',
                error: error?.message || String(error)
            });
            throw error;
        } finally {
            catalogRefreshInProgress = false;
        }
    }

    function startCatalogRevisionWatcher(baseUrl) {
        catalogRevisionWatcher?.stop?.();
        catalogRevisionWatcher = createCatalogRevisionWatcher({

        });

        });

    async function checkServerConnectionStatusOnly({ dataSource = serverConnectionState.dataSource || 'local files' } = {}) {
        if (!serverConnectionState.baseUrl) {
            setServerConnectionState({
                state: 'disconnected',
                connected: false,
                dataSource: 'packaged static catalog',
                error: null
            });
            startStaticCatalogRevisionWatcher();
            return null;
        }
        setServerConnectionState({
            state: 'checking',
            connected: false,
            dataSource: 'checking server',
            error: null
        });

        try {
            const connection = await checkServerConnectionWithFallback({ baseUrl: serverConnectionState.baseUrl });
            if (!connection.connected) {
                catalogRevisionWatcher?.stop?.();
                console.info('[server] Python server unavailable. Continuing with local satellite data.', connection.error);
                setServerConnectionState({
                    ...connection,
                    dataSource: 'local files'
                });
                startStaticCatalogRevisionWatcher();
                return null;
            }

            setServerConnectionState({
                ...connection,
                dataSource,
                error: null
            });
            startCatalogRevisionWatcher(connection.baseUrl);
            return connection;
        } catch (err) {
            console.warn('[server] Server status check failed. Continuing with local satellite data.', err);
            setServerConnectionState({
                state: 'disconnected',
                connected: false,
                baseUrl: serverConnectionState.baseUrl,
                dataSource: 'local files',
                error: err?.message || String(err)
            });
            startStaticCatalogRevisionWatcher();
            return null;
        }
    }

    function refreshShareControls() {
        const state = buildShareState(simParams, currentSelectedSatellite, selectedConjunctionEvent);
        const shareUrl = buildShareUrl(window.location.href, simParams, currentSelectedSatellite, selectedConjunctionEvent);
        if (shareStateSummaryElement) shareStateSummaryElement.textContent = shareStateSummary(state);
        if (shareLinkOutput) shareLinkOutput.value = shareUrl;
        if (nativeShareButton) {
            const supported = typeof navigator.share === 'function';
            nativeShareButton.disabled = !supported;
            nativeShareButton.title = supported ? 'Share using the browser native share dialog' : 'Native sharing is not supported by this browser';
        }
        if (copyShareImageButton) {
            const clipboardImageSupported = typeof ClipboardItem !== 'undefined' && !!navigator.clipboard?.write;
            copyShareImageButton.disabled = !latestShareImageBlob || !clipboardImageSupported;
            copyShareImageButton.title = clipboardImageSupported
                ? 'Copy the latest captured canvas image'
                : 'Image clipboard copy is not supported by this browser';
        }
        if (downloadShareImageButton) {
            downloadShareImageButton.disabled = !latestShareImageBlob;
        }
        return shareUrl;
    }

    function activeShareCanvas() {
        if (!simParams.view3D && simParams.viewMercator && mercatorCanvasElement) {
            return { canvas: mercatorCanvasElement, label: 'Mercator canvas' };
        }
        if (renderer?.domElement && simParams.view3D) {
            return { canvas: renderer.domElement, label: '3D globe canvas' };
        }
        if (mercatorCanvasElement && simParams.viewMercator) {
            return { canvas: mercatorCanvasElement, label: 'Mercator canvas' };
        }
        return { canvas: renderer?.domElement || mercatorCanvasElement || null, label: 'current canvas' };
    }

    function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
            if (!canvas?.toBlob) {
                reject(new Error('Canvas image capture is not supported by this browser.'));
                return;
            }
            try {
                canvas.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error('Canvas image capture returned no image data.'));
                }, 'image/png');
            } catch (err) {
                reject(err);
            }
        });
    }

    async function captureShareImage() {
        if (shareFeedback) shareFeedback.textContent = 'Capturing canvas image...';
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        const { canvas, label } = activeShareCanvas();
        if (!canvas) {
            throw new Error('No visible canvas is available to capture.');
        }
        const blob = await canvasToBlob(canvas);
        latestShareImageBlob = blob;
        if (latestShareImageUrl) URL.revokeObjectURL(latestShareImageUrl);
        latestShareImageUrl = URL.createObjectURL(blob);
        if (shareImagePreview) {
            shareImagePreview.src = latestShareImageUrl;
            shareImagePreview.hidden = false;
        }
        if (shareImagePlaceholder) shareImagePlaceholder.hidden = true;
        if (shareFeedback) shareFeedback.textContent = `Captured ${label}.`;
        refreshShareControls();
        return blob;
    }

    async function previewCurrentShareImage() {
        try {
            await captureShareImage();
        } catch (err) {
            latestShareImageBlob = null;
            if (shareFeedback) {
                shareFeedback.textContent =
                    `Canvas image capture is unavailable: ${err?.message || err}. Link sharing still works.`;
            }
            refreshShareControls();
        }
    }

    async function downloadCurrentShareImage() {
        try {
            const blob = latestShareImageBlob || await captureShareImage();
            const url = latestShareImageUrl || URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `openbexi-earth-orbit-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            if (shareFeedback) shareFeedback.textContent = 'Canvas image download started.';
        } catch (err) {
            if (shareFeedback) {
                shareFeedback.textContent =
                    `Download image failed: ${err?.message || err}. Link sharing still works.`;
            }
        }
    }

    async function copyCurrentShareImage() {
        const clipboardImageSupported = typeof ClipboardItem !== 'undefined' && !!navigator.clipboard?.write;
        if (!clipboardImageSupported) {
            if (shareFeedback) shareFeedback.textContent = 'Copy Image is not supported by this browser.';
            return;
        }
        try {
            const blob = latestShareImageBlob || await captureShareImage();
            await navigator.clipboard.write([
                new ClipboardItem({ [blob.type || 'image/png']: blob })
            ]);
            if (shareFeedback) shareFeedback.textContent = 'Canvas image copied.';
            refreshShareControls();
        } catch (err) {
            if (shareFeedback) {
                shareFeedback.textContent =
                    `Copy image failed: ${err?.message || err}. Link sharing still works.`;
            }
        }
    }

    async function copyCurrentShareLink() {
        const shareUrl = refreshShareControls();
        if (shareUrlContainsUnsafeLocalData(shareUrl)) {
            if (shareFeedback) shareFeedback.textContent = 'Share link blocked because it contained unsafe local data.';
            return;
        }
        try {
            if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(shareUrl);
            } else if (shareLinkOutput) {
                shareLinkOutput.select();
                document.execCommand('copy');
            }
            if (shareFeedback) shareFeedback.textContent = 'Share link copied.';
        } catch (err) {
            if (shareFeedback) shareFeedback.textContent = 'Copy failed. Select the generated link manually.';
        }
    }

    async function nativeShareCurrentState() {
        const shareUrl = refreshShareControls();
        if (!navigator.share || shareUrlContainsUnsafeLocalData(shareUrl)) return;
        try {
            let files = [];
            if (!latestShareImageBlob) {
                try {
                    await captureShareImage();
                } catch (err) {
                    if (shareFeedback) shareFeedback.textContent = 'Native share will continue without an image preview.';
                }
            }
            if (latestShareImageBlob && typeof File !== 'undefined' && navigator.canShare) {
                const imageFile = new File([latestShareImageBlob], 'openbexi-earth-orbit.png', {
                    type: latestShareImageBlob.type || 'image/png'
                });
                if (navigator.canShare({ files: [imageFile] })) {
                    files = [imageFile];
                }
            }
            await navigator.share({
                title: 'OpenBEXI Earth Orbit',
                text: 'OpenBEXI Earth Orbit shared tracked-object view',
                url: shareUrl,
                ...(files.length ? { files } : {})
            });
            if (shareFeedback) shareFeedback.textContent = 'Share dialog opened.';
        } catch (err) {
            if (shareFeedback) shareFeedback.textContent = 'Native share was cancelled or unavailable.';
        }
    }

    function resolveMarsTextureLoadingElements() {
        if (!marsTextureLoadingElement) {
            marsTextureLoadingElement = document.getElementById('marsTextureLoading');
            marsTextureLoadingLabelElement = document.getElementById('marsTextureLoadingLabel');
            marsTextureProgressFillElement = document.getElementById('marsTextureProgressFill');
            marsTextureProgressTextElement = document.getElementById('marsTextureProgressText');
        }
        return marsTextureLoadingElement;
    }

    function setMarsTextureLoadingState(state, progressPct = 0) {
        const panel = resolveMarsTextureLoadingElements();
        if (!panel) return;

        if (marsTextureLoadingHideTimer) {
            clearTimeout(marsTextureLoadingHideTimer);
            marsTextureLoadingHideTimer = null;
        }

        const pct = Math.max(0, Math.min(100, Math.round(progressPct)));
        panel.hidden = false;
        panel.classList.toggle('is-error', state === 'error');
        if (marsTextureProgressFillElement) marsTextureProgressFillElement.style.width = `${pct}%`;
        if (marsTextureProgressTextElement) marsTextureProgressTextElement.textContent = `${pct}%`;

        if (state === 'loading') {
            if (!marsTextureLoadingStartedAt) marsTextureLoadingStartedAt = performance.now();
            if (marsTextureLoadingLabelElement) marsTextureLoadingLabelElement.textContent = 'Loading Mars map/texture...';
        } else if (state === 'complete') {
            if (marsTextureLoadingLabelElement) marsTextureLoadingLabelElement.textContent = 'Mars map/texture loaded';
            const elapsedMs = marsTextureLoadingStartedAt ? performance.now() - marsTextureLoadingStartedAt : 0;
            const hideDelayMs = Math.max(900, MARS_TEXTURE_LOADING_MIN_VISIBLE_MS - elapsedMs);
            marsTextureLoadingHideTimer = setTimeout(() => {
                panel.hidden = true;
                marsTextureLoadingStartedAt = 0;
            }, hideDelayMs);
        } else if (state === 'error') {
            if (marsTextureLoadingLabelElement) {
                marsTextureLoadingLabelElement.textContent = 'Mars texture failed to load. Using fallback Mars color.';
            }
            const elapsedMs = marsTextureLoadingStartedAt ? performance.now() - marsTextureLoadingStartedAt : 0;
            const hideDelayMs = Math.max(5000, MARS_TEXTURE_LOADING_MIN_VISIBLE_MS - elapsedMs);
            marsTextureLoadingHideTimer = setTimeout(() => {
                panel.hidden = true;
                marsTextureLoadingStartedAt = 0;
            }, hideDelayMs);
        }
    }

    function hideMarsTextureLoadingPanel() {
        const panel = resolveMarsTextureLoadingElements();
        if (!panel) return;
        if (marsTextureLoadingHideTimer) {
            clearTimeout(marsTextureLoadingHideTimer);
            marsTextureLoadingHideTimer = null;
        }
        panel.hidden = true;
        marsTextureLoadingStartedAt = 0;
    }

    function recordMarsTextureLoadState(state, progressPct = 0) {
        marsTextureLoadStatus = state;
        marsTextureLoadProgressPct = Math.max(0, Math.min(100, Math.round(progressPct)));
        if (shouldShowMarsTextureProgress()) {

    function showMarsTextureProgressForSelection() {

            : 10;
        setMarsTextureLoadingState('loading', progressPct);

    function updateEarthTexture() {
        if (!earthMesh || !textureLoader || !earthConfig) return;

        const textureToLoad = simParams.useHighDefTexture ? earthConfig.texture : earthConfig.textureLight;
        if (!textureToLoad) {
            earthMesh.material.map = null;
            earthMesh.material.color.set(0x1a237e);
            earthMesh.material.needsUpdate = true;
            return;
        }

        textureLoader.load(
            textureToLoad,
            (texture) => {
                // Reasonable defaults for globe (keep mipmaps for quality)
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy?.() || 1;
                earthMesh.material.map = texture;
                earthMesh.material.color.set(0xffffff);
                earthMesh.material.needsUpdate = true;
            },
            undefined,
            () => {
                earthMesh.material.map = null;
                earthMesh.material.color.set(0x1c313a);
                earthMesh.material.needsUpdate = true;
            }
        );
    }

    function createMilkyWayFallbackTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 2048;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#02040c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 7200; i++) {
            const x = Math.abs((Math.sin(i * 12.9898) * 43758.5453) % 1) * canvas.width;
            const y = Math.abs((Math.sin(i * 78.233) * 23454.123) % 1) * canvas.height;
            const alpha = 0.07 + ((i % 17) / 17) * 0.28;
            ctx.fillStyle = `rgba(220, 235, 255, ${alpha})`;
            ctx.fillRect(x, y, 1, 1);
        }

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-0.16);
        for (let band = 0; band < 10; band++) {
            const width = 70 + band * 28;
            const alpha = 0.13 - band * 0.008;
            const gradient = ctx.createLinearGradient(-canvas.width / 2, -width, canvas.width / 2, width);
            gradient.addColorStop(0, `rgba(74, 112, 170, ${alpha * 0.38})`);
            gradient.addColorStop(0.45, `rgba(205, 220, 255, ${alpha})`);
            gradient.addColorStop(0.55, `rgba(255, 218, 166, ${alpha * 0.72})`);
            gradient.addColorStop(1, `rgba(54, 80, 140, ${alpha * 0.38})`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, canvas.width * 0.58, width, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        return texture;
    }

    function createIntegratedStarMaterial() {
        return new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            depthTest: true,
            blending: THREE.AdditiveBlending,
            vertexColors: true,
            uniforms: {
                opacityScale: { value: 1.0 }
            },
            vertexShader: `
                attribute float pointSize;
                attribute float alpha;
                varying vec3 vColor;
                varying float vAlpha;
                void main() {
                    vColor = color;
                    vAlpha = alpha;
                    gl_PointSize = pointSize;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float opacityScale;
                varying vec3 vColor;
                varying float vAlpha;
                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float d = length(uv);
                    float alpha = smoothstep(0.5, 0.0, d) * vAlpha * opacityScale;
                    gl_FragColor = vec4(vColor, alpha);
                }
            `
        });
    }

    function createStarTextSprite(text) {
        const canvas = document.createElement('canvas');
        canvas.width = STAR_LABEL_CANVAS_WIDTH;
        canvas.height = STAR_LABEL_CANVAS_HEIGHT;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(3, 8, 18, 0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = `bold ${STAR_LABEL_FONT_PX}px Trebuchet MS, Segoe UI, sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
        ctx.lineWidth = 10;
        ctx.strokeText(text, 34, canvas.height / 2 + 2);
        ctx.fillStyle = '#dff4ff';
        ctx.fillText(text, 34, canvas.height / 2 + 2);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;
        const material = new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            depthWrite: false,
            depthTest: true
        });
        const sprite = new THREE.Sprite(material);
        const labelHeight = STAR_SKY_RADIUS * STAR_LABEL_WORLD_HEIGHT_FACTOR;
        sprite.scale.set(labelHeight * (canvas.width / canvas.height), labelHeight, 1);
        return sprite;
    }

    function updateBrightStarLabels() {
        if (brightStarLabelGroup) {
            brightStarLabelGroup.traverse(obj => {
                if (obj.material?.map) obj.material.map.dispose();
                if (obj.material) obj.material.dispose();
            });
            scene.remove(brightStarLabelGroup);
        }

        brightStarLabelGroup = new THREE.Group();
        BRIGHT_STARS_DEMO
            .filter(star => star.mag < STAR_LABEL_MAGNITUDE_LIMIT)
            .forEach(star => {
                const p = raDecToCartesian({
                    raHours: star.raHours,
                    raDeg: star.raDeg,
                    decDeg: star.decDeg,
                    radius: STAR_LABEL_RADIUS
                });
                const sprite = createStarTextSprite(star.name);
                sprite.position.set(p.x, p.y, p.z);
                brightStarLabelGroup.add(sprite);
            });
        brightStarLabelGroup.name = 'Bright Star Labels';
        scene.add(brightStarLabelGroup);
        updateStarSkyVisibility();
    }

    function updateBundledStarField() {
        if (!scene) return;
        const starData = buildStarBufferData(BRIGHT_STARS_DEMO, {
            radius: STAR_SKY_RADIUS,
            magnitudeLimit: Number.POSITIVE_INFINITY,
            colorMode: 'color'
        });
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(starData.positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(starData.colors, 3));
        geometry.setAttribute('pointSize', new THREE.BufferAttribute(starData.sizes, 1));
        geometry.setAttribute('alpha', new THREE.BufferAttribute(starData.alphas, 1));

        if (!starMaterial) starMaterial = createIntegratedStarMaterial();
        if (starPoints) {
            starPoints.geometry.dispose();
            starPoints.geometry = geometry;
        } else {
            starPoints = new THREE.Points(geometry, starMaterial);
            starPoints.name = 'Stars and Milky Way real RA Dec star field';
            starPoints.renderOrder = -20;
            scene.add(starPoints);
        }
        starPoints.userData.visibleStarCount = starData.stars.length;
        updateStarCatalogSummaryVisibility();
        updateBrightStarLabels();
        updateStarSkyVisibility();
    }

    function makeRaDecGridLine(points, color = 0x476f9c) {
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
            color,
            transparent: true,
            opacity: 0.28,
            depthWrite: false,
            depthTest: true
        });
        return new THREE.Line(geometry, material);
    }

    function createRaDecGrid() {
        raDecGrid = new THREE.Group();
        raDecGrid.name = 'RA Dec Grid';
        const radius = STAR_SKY_RADIUS * 0.985;
        for (let dec = -60; dec <= 60; dec += 30) {
            const points = [];
            for (let ra = 0; ra <= 360; ra += 3) {
                const p = raDecToCartesian({ raDeg: ra, decDeg: dec, radius });
                points.push(new THREE.Vector3(p.x, p.y, p.z));
            }
            raDecGrid.add(makeRaDecGridLine(points, dec === 0 ? 0x77a8d8 : 0x476f9c));
        }
        for (let ra = 0; ra < 360; ra += 30) {
            const points = [];
            for (let dec = -90; dec <= 90; dec += 3) {
                const p = raDecToCartesian({ raDeg: ra, decDeg: dec, radius });
                points.push(new THREE.Vector3(p.x, p.y, p.z));
            }
            raDecGrid.add(makeRaDecGridLine(points));
        }
        scene.add(raDecGrid);
    }

    function createStarAtmosphere() {
        const material = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            uniforms: {
                glowColor: { value: new THREE.Color(0x78c7ff) }
            },
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 glowColor;
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.62 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.4);
                    gl_FragColor = vec4(glowColor, clamp(intensity, 0.0, 0.48));
                }
            `
        });
        starAtmosphereMesh = new THREE.Mesh(
            new THREE.SphereGeometry(EARTH_SCENE_RADIUS * 1.045, 96, 64),
            material
        );
        starAtmosphereMesh.name = 'Stars and Milky Way optional atmosphere';
        scene.add(starAtmosphereMesh);
    }

    function initStarsMilkyWayLayer() {
        const milkyWayMaterial = new THREE.MeshBasicMaterial({
            map: createMilkyWayFallbackTexture(),
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.76,
            depthWrite: false,
            depthTest: true
        });
        milkyWaySphere = new THREE.Mesh(
            new THREE.SphereGeometry(STAR_SKY_RADIUS * 1.02, 96, 64),

        );
        milkyWaySphere.name = 'Stars and Milky Way celestial sphere';

        textureLoader.load(

            texture => {
                texture.colorSpace = THREE.SRGBColorSpace;
                milkyWayMaterial.map = texture;
                milkyWayMaterial.needsUpdate = true;
            },
            undefined,
            () => {
                milkyWayMaterial.needsUpdate = true;
            }
        );

        createRaDecGrid();
        createStarAtmosphere();
        updateBundledStarField();
        updateStarSkyVisibility();
    }

    function snapshotSolarSystemPreviousState() {
        if (!camera || !controls) return null;
        return {
            view3D: simParams.view3D,

            otherSelection: simParams.otherSelection,
            showOrbit: simParams.showOrbit,
            showOrbitFrame: simParams.showOrbitFrame,
            showYPR: simParams.showYPR,
            showFootprint: simParams.showFootprint,

            controlsMinDistance: controls.minDistance,
            controlsMaxDistance: controls.maxDistance,
            detailedSatelliteModelVisible: detailedSatelliteModel?.visible === true
        };
    }

    function restoreSolarSystemPreviousState() {
        const previous = solarSystemPreviousState;
        if (!previous) return;
        simParams.view3D = previous.view3D;
        simParams.viewMercator = previous.viewMercator;
        simParams.otherSelection = previous.otherSelection;
        simParams.showOrbit = previous.showOrbit;
        simParams.showOrbitFrame = previous.showOrbitFrame;
        simParams.showYPR = previous.showYPR;
        simParams.showFootprint = previous.showFootprint;
        if (camera) camera.position.copy(previous.cameraPosition);
        if (controls) {
            controls.target.copy(previous.controlsTarget);
            controls.minDistance = previous.controlsMinDistance;
            controls.maxDistance = previous.controlsMaxDistance;
            controls.update();
        }
        if (detailedSatelliteModel) {
            detailedSatelliteModel.visible = !!previous.detailedSatelliteModelVisible;
        }
        solarSystemPreviousState = null;
    }

    function setSolarSystemEarthLayerVisibility(active) {
        if (earthMesh) earthMesh.visible = !active;
        if (moon) moon.visible = !active;
        if (mars) mars.visible = !active;
        satellites.forEach(s => {
            if (s.mesh && active) s.mesh.visible = false;
        });
        if (detailedSatelliteModel && active) detailedSatelliteModel.visible = false;
        if (selectedModelFillLight && active) selectedModelFillLight.visible = false;
        if (selectedModelEarthAlbedoLight && active) selectedModelEarthAlbedoLight.visible = false;
        if (orbitFrame && active) setOrbitFrameVisibility(orbitFrame, false);
        if (yprFrame && active) setYPRVisibility(yprFrame, false);
        const selectedOrbit = scene?.getObjectByName?.('selectedOrbitTrajectoryRoot');
        if (selectedOrbit) selectedOrbit.visible = !active && !!simParams.showOrbit;
        if (selectedSatelliteDetailPanel) selectedSatelliteDetailPanel.hidden = active || !currentSelectedSatellite;
        if (mercatorContainer && active) mercatorContainer.style.display = 'none';
        ['labelXecr','labelYecr','labelZecr','labelNorthPole','labelEquatorLine','labelGreenwichMeridian']
            .forEach(id => { const el = document.getElementById(id); if (el && active) el.style.display = 'none'; });
        updateStarSkyVisibility();

    function setSolarSystemOverviewMode(enabled, { restorePrevious = true, resetOverviewCamera = true } = {}) {
        const next = !!enabled;
        if (next === !!simParams.solarSystemOverview) {
            syncSolarSystemControlsState();
            return;
        }
        if (next) {
            solarSystemPreviousState = snapshotSolarSystemPreviousState();
            simParams.solarSystemOverview = true;
            simParams.solarSystemFocusedPlanet = null;
            simParams.view3D = true;
            simParams.viewMercator = false;
            setSolarSystemOverviewVisible(solarSystemOverview, true);
            if (resetOverviewCamera) resetSolarSystemOverviewCamera(solarSystemOverview, camera, controls);
        } else {
            simParams.solarSystemOverview = false;
            simParams.solarSystemFocusedPlanet = null;
            setSolarSystemOverviewVisible(solarSystemOverview, false);
            setSolarSystemSelectedPlanet(solarSystemOverview, null);
            if (restorePrevious) restoreSolarSystemPreviousState();
            if (!restorePrevious) solarSystemPreviousState = null;
            restoreEarthControlLimits();
            updateSatelliteList();
            if (renderer?.domElement) renderer.domElement.style.cursor = '';
        }
        setSolarSystemEarthLayerVisibility(simParams.solarSystemOverview);
        syncSolarSystemControlsState();
        updateViewShortcutButtonsState();
        if (view3DToggle) view3DToggle.checked = simParams.view3D;
        if (viewMercatorToggle) viewMercatorToggle.checked = simParams.viewMercator;
        if (showOrbitToggle) showOrbitToggle.checked = simParams.showOrbit;
        if (showOrbitFrameToggleElement) showOrbitFrameToggleElement.checked = simParams.showOrbitFrame;
        const showFootprintChk = document.getElementById('showFootprintCheckbox');
        if (showFootprintChk) showFootprintChk.checked = simParams.showFootprint;
        const showDayNightToggle = document.getElementById('showDayNightToggle');
        if (showDayNightToggle) showDayNightToggle.checked = simParams.showDayNight;
        updateSolarSystemOptions();
    }

    function focusSolarSystemPlanetInMode(planetName) {
        if (!planetName) return;
        if (planetName === 'Earth') {
            activateEarthFromSolarSystemSelection();
            return;
        }
        if (planetName === 'Moon') {
            activateMoonFromSolarSystemSelection();
            return;
        }
        if (planetName === 'Mars') {
            activateMarsFromSolarSystemSelection();
            return;
        }
        simParams.solarSystemFocusedPlanet = planetName;
        focusSolarSystemPlanet(solarSystemOverview, planetName, camera, controls);
        updateSolarSystemSelectionUi();
    }

    function returnToSolarSystemOverview() {
        simParams.solarSystemFocusedPlanet = null;
        resetSolarSystemOverviewCamera(solarSystemOverview, camera, controls);
        updateSolarSystemSelectionUi();
    }

    function handleSolarSystemPointerMove(event) {
        if (!simParams.solarSystemOverview || !renderer?.domElement) return;
        const planetName = pickSolarSystemPlanet(solarSystemOverview, event, camera);
        renderer.domElement.style.cursor = planetName ? 'pointer' : 'grab';
    }

    function handleSolarSystemPointerClick(event) {
        if (!simParams.solarSystemOverview) return;
        const planetName = pickSolarSystemPlanet(solarSystemOverview, event, camera);
        if (planetName) focusSolarSystemPlanetInMode(planetName);
    }

    function handleSolarSystemKeydown(event) {
        if (!simParams.solarSystemOverview || event.key !== 'Escape') return;
        if (simParams.solarSystemFocusedPlanet) {
            returnToSolarSystemOverview();
        } else {
            setSolarSystemOverviewMode(false, { restorePrevious: true });
        }
    }

    function init3D() {
        /* Scene, Camera, Renderer */
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
            sceneConfig.camera.fov,
            window.innerWidth / window.innerHeight,
            sceneConfig.camera.near,
            sceneConfig.camera.far
        );
        camera.position.set(...sceneConfig.camera.position);
        defaultCameraNear = camera.near;
        defaultCameraFar = camera.far;
        defaultCameraUp = camera.up.clone();

        renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = SCENE_TONE_MAPPING_EXPOSURE;
        // Keep global shadows on; Sun light in drawDayNight3D has shadows disabled by default
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // expose
        window.renderer = renderer;
        window.camera = camera;

        /* Lighting */
        scene.add(new THREE.AmbientLight(0xffffff, 0.15));

        const dirLight = new THREE.DirectionalLight(
            sceneConfig.directionalLight.color,
            Math.min(sceneConfig.directionalLight.intensity, 0.08)
        );
        dirLight.name = 'legacyLowSceneFillLight';
        dirLight.position.set(...sceneConfig.directionalLight.position);
        // Keep shadows off on helper light to save perf
        dirLight.castShadow = false;
        scene.add(dirLight);

        selectedModelFillLight = new THREE.PointLight(
            0xffffff,
            SELECTED_MODEL_FILL_LIGHT_INTENSITY,
            0,
            SELECTED_MODEL_FILL_LIGHT_DECAY
        );
        selectedModelFillLight.visible = false;
        scene.add(selectedModelFillLight);

        selectedModelEarthAlbedoTarget = new THREE.Object3D();
        selectedModelEarthAlbedoTarget.name = 'selectedModelEarthAlbedoTarget';
        scene.add(selectedModelEarthAlbedoTarget);

        selectedModelEarthAlbedoLight = new THREE.DirectionalLight(0x9fd8ff, 0);
        selectedModelEarthAlbedoLight.name = 'selectedModelEarthAlbedoLight';
        selectedModelEarthAlbedoLight.castShadow = false;
        selectedModelEarthAlbedoLight.visible = false;
        selectedModelEarthAlbedoLight.target = selectedModelEarthAlbedoTarget;
        scene.add(selectedModelEarthAlbedoLight);

        /* Earth */
        textureLoader = new THREE.TextureLoader();
        const earthMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
        earthMat.depthTest = true;
        earthMat.depthWrite = true;
        earthMat.transparent = false;
        earthMesh = new THREE.Mesh(
            new THREE.SphereGeometry(EARTH_SCENE_RADIUS, 64, 64),
            earthMat
        );
        earthMesh.receiveShadow = true;
        earthMesh.renderOrder = 0;
        scene.add(earthMesh);
        updateEarthTexture();

        /* ECEF Axes */
        addECEFAxes(scene);
        updateECEFAxesVisibility(simParams);

        /* LVLH */
        orbitFrame = createOrbitFrame(scene);
        setOrbitFrameVisibility(orbitFrame, false);

        /* Moon (always visible) */
        moon = createMoon(scene, EARTH_SCENE_RADIUS, {
            textureUrl: 'textures/moon_map2.jpg'
        });
        updateMoon(moon, SIM_DATE);

        /* Mars (always available for Earth/Moon/Mars context switching) */
        mars = createMars(scene, EARTH_SCENE_RADIUS, {
            textureUrl: MARS_TEXTURE_URL,
            onTextureLoadStart: () => recordMarsTextureLoadState('loading', 0),
            onTextureLoadProgress: handleMarsTextureProgress,
            onTextureLoadComplete: () => recordMarsTextureLoadState('complete', 100),
            onTextureLoadError: () => recordMarsTextureLoadState('error', 100)
        });
        updateMars(mars, SIM_DATE);

        /* Stars & Milky Way (created hidden; toggled from Views & Time) */
        initStarsMilkyWayLayer();

        /* Controls */
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = controlsConfig.enableDamping;
        controls.dampingFactor = controlsConfig.dampingFactor;
        controls.enablePan = false;
        controls.minDistance = EARTH_MODE_MIN_DISTANCE;
        controls.maxDistance = SAFE_MAX_CONTROL_DISTANCE;
        defaultControlsMinDistance = controls.minDistance;
        defaultControlsMaxDistance = controls.maxDistance;
        controls.enableZoom = true;
        camera.far = SAFE_CAMERA_FAR;
        defaultCameraFar = camera.far;
        camera.updateProjectionMatrix();

        /* Solar System Overview (created hidden; toggled from Views & Time) */
        solarSystemOverview = createSolarSystemOverview(scene, { renderer, camera, controls, initialDate: SIM_DATE });
        setSolarSystemOverviewVisible(solarSystemOverview, false);
        renderer.domElement.addEventListener('pointermove', handleSolarSystemPointerMove);
        renderer.domElement.addEventListener('click', handleSolarSystemPointerClick);
        window.addEventListener('keydown', handleSolarSystemKeydown);
    }
